<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Leelawadee UI, Tahoma, Noto Sans Thai, Loma, sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#1f2328">ลำดับศักดิ์ของกฎหมาย และตัวอย่างในงานไฟฟ้า</text>
  <text x="32" y="62" font-size="13" fill="#6f6f6f">กฎหมายลำดับต่ำกว่าต้องออกตามอำนาจ และขัดหรือแย้งกับกฎหมายที่สูงกว่าไม่ได้</text>
  <g font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">
    <path d="M250 90L340 90L370 150L220 150Z" fill="#1f3b70"/>
    <text x="295" y="128">รัฐธรรมนูญ</text>
    <path d="M200 154L390 154L420 214L170 214Z" fill="#244a8c"/>
    <text x="295" y="190" font-size="12">พ.ร.บ. · พ.ร.ก. · ประมวลกฎหมาย</text>
    <path d="M170 218L420 218L450 278L140 278Z" fill="#2c5fb0"/>
    <text x="295" y="254">พระราชกฤษฎีกา</text>
    <path d="M140 282L450 282L490 342L100 342Z" fill="#3b82e6"/>
    <text x="295" y="318">กฎกระทรวง</text>
    <path d="M100 346L490 346L530 406L60 406Z" fill="#7aa9f0"/>
    <text x="295" y="382">ประกาศ · ระเบียบ · ข้อบังคับ</text>
  </g>
  <g font-size="13" fill="#1f2328">
    <path d="M500 190H540" stroke="#9aa4ad" stroke-width="2"/>
    <text x="548" y="186">พ.ร.บ.ความปลอดภัย อาชีวอนามัย และ</text>
    <text x="548" y="204">สภาพแวดล้อมในการทำงาน พ.ศ. 2554</text>
    <path d="M500 318H540" stroke="#9aa4ad" stroke-width="2"/>
    <text x="548" y="314">กฎกระทรวง…ความปลอดภัยฯ เกี่ยวกับไฟฟ้า</text>
    <text x="548" y="332">พ.ศ. 2558 (ออกตาม พ.ร.บ. ข้างบน)</text>
    <path d="M540 382H560" stroke="#9aa4ad" stroke-width="2"/>
    <text x="568" y="378">มาตรฐานการติดตั้งทางไฟฟ้า (วสท.)</text>
    <text x="568" y="396" fill="#6f6f6f">ถูกอ้างถึงในกฎกระทรวงเรื่องระยะห่าง</text>
  </g>
</svg>
