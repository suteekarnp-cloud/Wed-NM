  <text x="32" y="38" font-size="20" font-weight="700" fill="#1f2328">สัญญาณ PWM ควบคุมมุมเซอร์โวมอเตอร์</text>
  <text x="32" y="62" font-size="13" fill="#6f6f6f">คาบสัญญาณประมาณ 20 ms (50 Hz) · ความกว้างพัลส์กำหนดมุม</text>

  <g font-size="12" fill="#6f6f6f"><text x="32" y="122">0°</text><text x="32" y="212">90°</text><text x="32" y="302">180°</text></g>
  <g fill="none" stroke-width="3" stroke-linejoin="round">
    <path d="M80 130H110V100H124V130H560V100H574V130H600" stroke="#2f80ed"/>
    <path d="M80 220H110V190H152V220H560V190H602V220H620" stroke="#10a66f"/>
    <path d="M80 310H110V280H180V310H560V280H630V310H650" stroke="#e08a1e"/>
