    <text x="158" y="186" fill="#10a66f">≈ 1.5 ms (กึ่งกลาง)</text>
    <text x="186" y="276" fill="#e08a1e">≈ 2.5 ms</text>
  </g>
  <path d="M110 340V352M560 340V352M110 346H560" stroke="#1f2328" stroke-width="1.5" fill="none"/>
  <text x="335" y="372" font-size="13" fill="#1f2328" text-anchor="middle">20 ms ต่อ 1 รอบ</text>
  <text x="80" y="410" font-size="12" fill="#6f6f6f">หมายเหตุ: ค่าพัลส์จริงต่างกันตามรุ่น บางรุ่นใช้ช่วง 1.0–2.0 ms ควรทดสอบก่อนใช้งานเพื่อไม่ให้เฟืองค้าง</text>

