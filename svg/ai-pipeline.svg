<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Leelawadee UI, Tahoma, Noto Sans Thai, Loma, sans-serif">
  <rect width="880" height="380" fill="#ffffff"/>
  <text x="32" y="38" font-size="20" font-weight="700" fill="#1f2328">นำผลการตรวจจับของ AI ไปสั่งงานบอร์ด ESP32</text>
  <text x="32" y="62" font-size="13" fill="#6f6f6f">คอมพิวเตอร์ประมวลผลภาพ · ส่งคำสั่งเป็นข้อความผ่านพอร์ต USB Serial · ESP32 เปิด-ปิดอุปกรณ์ที่ขา GPIO</text>

  <g>
