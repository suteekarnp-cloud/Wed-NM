/* search */
function searchIndex(){
  var out=[];
  data.subjects.forEach(function(s){(s.sections||[]).forEach(function(sec,si){
    if(sec.type!=='lessons'&&sec.type!=='worksheets')return;
    (sec.items||[]).forEach(function(it){
      out.push({sid:s.id,code:s.code,si:si,id:it.id,kind:sec.title,title:it.title||'',text:plain((it.desc||'')+' '+(it.body||'')+' '+(it.code||[]).map(function(c){return c.name}).join(' '))});
    });
  })});
  return out;
}
function searchHits(){
  var q=state.q.trim().toLowerCase();if(!q)return [];
  var toks=q.split(/\s+/);
  return searchIndex().filter(function(e){
    if(state.qScope!=='all'&&e.sid!==state.qScope)return false;
    var hay=(e.title+' '+e.text).toLowerCase();
    return toks.every(function(t){return hay.indexOf(t)>=0});
  }).map(function(e){e.score=toks.filter(function(t){return e.title.toLowerCase().indexOf(t)>=0}).length;return e})
    .sort(function(a,b){return b.score-a.score}).slice(0,8);
}
function snippet(text,q){
  var t=q.trim().split(/\s+/)[0]||'',i=text.toLowerCase().indexOf(t.toLowerCase());
  if(i<0)return text.slice(0,120);var a=Math.max(0,i-40);return (a?'…':'')+text.slice(a,a+140)+'…';
}
function renderResults(){
  var box=D.getElementById('feed');if(!box)return;
  var go=D.getElementById('qgo');if(go){var on=!!state.q.trim();go.classList.toggle('is-on',on);go.disabled=!on}
  var h=D.getElementById('feed-h');
  if(!state.q.trim()){
    if(h)h.textContent='หัวข้อแนะนำ';
    var rec=[];
    data.subjects.forEach(function(s){(s.sections||[]).forEach(function(sec,si){if(sec.type==='lessons'&&sec.items&&sec.items[0])rec.push({sid:s.id,code:s.code,si:si,id:sec.items[0].id,title:sec.items[0].title,text:sec.items[0].desc||''})})});
    box.innerHTML=rec.map(function(r){return '<a href="#'+esc(r.sid)+'" data-hit="'+esc(r.sid)+'|'+r.si+'|'+esc(r.id)+'"><span class="code">'+esc(r.code)+'</span><b>'+esc(r.title)+'</b><small>'+esc(r.text)+'</small></a>'}).join('');
    return;
  }
  if(h)h.textContent='ผลการค้นหา';
  var hits=searchHits();
  box.innerHTML=hits.length?hits.map(function(x){
    return '<a href="#'+esc(x.sid)+'" data-hit="'+esc(x.sid)+'|'+x.si+'|'+esc(x.id)+'"><span class="code">'+esc(x.code)+'</span><b>'+esc(x.title)+'</b><small>'+esc(x.kind)+' · '+esc(snippet(x.text,state.q))+'</small></a>';
  }).join(''):'<p class="none">ไม่พบหัวข้อที่ตรงกับ “'+esc(state.q)+'” ลองใช้คำที่สั้นลง</p>';
}
var carTimer=null,carIdx=0;
function setCar(i){
  var t=D.getElementById('car-track');if(!t)return;carIdx=i;t.style.transform='translateX(-'+(i*100)+'%)';
  Array.prototype.forEach.call(D.querySelectorAll('.car-dots button'),function(b,j){b.classList.toggle('is-on',j===i);if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
}
function initCarousel(){
  clearInterval(carTimer);var tr=D.getElementById('car-track');if(!tr)return;
  var n=tr.children.length;if(n<2)return;if(carIdx>=n)carIdx=0;setCar(carIdx);
  if(!smooth())return;
  carTimer=setInterval(function(){var t=D.getElementById('car-track');if(!t){clearInterval(carTimer);return}if(t.parentNode.matches(':hover')||D.hidden)return;setCar((carIdx+1)%t.children.length)},5000);
}
function openHit(sid,si,id){
  state.route=sid;state.tab[sid]=si;state.open=id;state.menu=null;render();
  try{history.replaceState(null,'','#'+sid)}catch(e){}
  setTimeout(function(){var el=D.getElementById('it-'+id);if(el)el.scrollIntoView({block:'start'});else window.scrollTo(0,0)},0);

/* timetable (lives inside the dark bento card) */
function renderTimetable(){
  var slots=[];
  data.subjects.forEach(function(s){(s.slots||[]).forEach(function(sl){var a=toMin(sl.s),b=toMin(sl.e);if(a!=null&&b!=null&&b>a)slots.push({d:+sl.d,a:a,b:b,room:sl.room,group:sl.group,sub:s})})});
  var start=8*60,end=17*60;
  slots.forEach(function(x){start=Math.min(start,Math.floor(x.a/60)*60);end=Math.max(end,Math.ceil(x.b/60)*60)});
  var units=(end-start)/30,hours=units/2;
  var days=[1,2,3,4,5];if(slots.some(function(x){return x.d===6}))days.push(6);if(slots.some(function(x){return x.d===0}))days.push(0);
  var h='';
  for(var i=0;i<hours;i++){var hh=(start/60)+i;h+='<div class="tt-h" style="grid-column:'+(2+i*2)+' / span 2">'+pad(hh)+':00</div>'}
  days.forEach(function(d,ri){h+='<div class="tt-d" style="grid-row:'+(ri+2)+'">'+DAYS[d]+'</div><div class="tt-row" style="grid-row:'+(ri+2)+'"></div>'});
  if(12*60>=start&&13*60<=end){var lc=2+(12*60-start)/30;h+='<div class="tt-lunch" style="grid-row:2 / span '+days.length+';grid-column:'+lc+' / span 2">พักกลางวัน</div>'}
  slots.forEach(function(x){
    var ri=days.indexOf(x.d);if(ri<0)return;
    var c1=2+(x.a-start)/30,c2=2+(x.b-start)/30;
    var info=[x.sub.code,x.group,x.room?'ห้อง '+x.room:''].filter(Boolean);
    h+='<a class="tt-b" href="#'+esc(x.sub.id)+'" data-go="'+esc(x.sub.id)+'" style="grid-row:'+(ri+2)+';grid-column:'+c1+' / '+c2+';background:'+subjColor(x.sub)+';color:#0b1406" title="'+esc(x.sub.name+' · '+info.join(' · '))+'">'+
      '<b>'+esc(x.sub.code)+'</b>'+(x.group?'<span>'+esc(x.group)+'</span>':'')+(x.room?'<span>ห้อง '+esc(x.room)+'</span>':'')+'</a>';
  });
  var tot=totals();
  return '<div class="tt-head"><div><p class="eyebrow" style="color:var(--lime)">ตารางสอน</p><h3>สัปดาห์ละ '+tot.h+' ชั่วโมง ใน '+data.subjects.length+' รายวิชา</h3></div>'+
    '<p class="tt-note">07:30–08:00 กิจกรรมหน้าเสาธง · 12:00–13:00 พักกลางวัน</p></div>'+
    '<div class="tt-scroll" tabindex="0" aria-label="ตารางสอนรายสัปดาห์ เลื่อนซ้ายขวาได้"><div class="tt-grid" style="--units:'+units+';--hours:'+hours+'">'+h+'</div></div>';
}

    else if(f.type==='number'){var v=val('f-'+f.k).trim();out[f.k]=v===''?null:Math.max(0,parseInt(v,10)||0)}

  return {pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',txt:'text/plain',csv:'text/csv',md:'text/markdown'}[ext(name)]||'';
}
function onFile(inp){
  var f=inp.files&&inp.files[0],target=inp.getAttribute('data-target');if(!f||!assetsNS||!target)return;
  var msg=D.getElementById(target+'-msg')||{textContent:''};var t=typeFor(f.name);
  var imgOnly=inp.getAttribute('accept')==='image/*';
  if(!t||(imgOnly&&t.indexOf('image/')!==0)){msg.textContent=imgOnly?'อัปโหลดได้เฉพาะไฟล์รูปภาพ':'ไฟล์ชนิดนี้อัปโหลดไม่ได้ ให้อัปขึ้น Google Drive แล้ววางลิงก์แทน';inp.value='';return}
  if(f.size>20*1024*1024){msg.textContent='ไฟล์ใหญ่เกิน 20 MB ให้อัปขึ้น Google Drive แล้ววางลิงก์แทน';inp.value='';return}
  msg.textContent='กำลังอัปโหลด '+f.name+' …';
  assetsNS.upload(f,{type:t}).then(function(r){
    var u=D.getElementById(target);if(u)u.value=r.url||('/_blob/'+r.id);
    if(target==='f-url'){var fn=D.getElementById('f-fileName');if(fn)fn.value=f.name}
    msg.textContent='แนบแล้ว: '+f.name;
  }).catch(function(err){
    var c=err&&err.code;
    msg.textContent=c==='too_large'?'ไฟล์ใหญ่เกินกำหนด':c==='unsupported_type'?'ไฟล์ชนิดนี้อัปโหลดไม่ได้':c==='quota_or_state'?'พื้นที่เก็บไฟล์เต็ม ใช้ลิงก์ Google Drive แทน':c==='rate_limited'?'อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่':c==='static_file'?'เว็บแบบนี้แนบได้เฉพาะรูปภาพ ไฟล์อื่นให้อัปขึ้น Google Drive แล้ววางลิงก์':c==='not_granted'||c==='capability_disabled'?'บัญชีนี้อัปโหลดไฟล์ไม่ได้ ใช้ลิงก์แทน':'อัปโหลดไม่สำเร็จ ลองใหม่อีกครั้ง';
  });
  inp.value='';
}

function armed(btn,label){

function validItem(type,v){
  if(type==='text'?!(v.desc||'').trim():!(v.title||'').trim())return type==='text'?'กรุณาใส่ข้อความ':'กรุณาใส่ชื่อรายการ';

  if(type==='gallery'&&!safeUrl(u))return 'กรุณาใส่ลิงก์รูป หรืออัปโหลดรูป';
  var bad=(v.images||[]).filter(function(im){return im.url&&!safeUrl(im.url)});if(bad.length)return 'ลิงก์รูปต้องขึ้นต้นด้วย https://';
  return '';
}
function makeItem(base,v,type){
  base.title=(v.title||'').trim();base.desc=(v.desc||'').trim();
  var u=safeUrl(v.url);base.url=u;
  if(u&&u.indexOf('/_blob/')===0&&v.fileName)base.fileName=v.fileName;
  if(type==='lessons'||type==='worksheets'){
    base.body=v.body||'';
    base.images=(v.images||[]).filter(function(im){return safeUrl(im.url)}).map(function(im){return {url:safeUrl(im.url),cap:im.cap}});
    base.code=(v.code||[]).filter(function(c){return c.src&&c.src.trim()}).map(function(c){return {name:c.name||'code',lang:c.lang||'text',src:c.src.replace(/\s+$/,'')}});
  }
  return base;
}
function findItem(id){
  var r=null;data.subjects.concat(data.pages).forEach(function(o){(o.sections||[]).forEach(function(sec){(sec.items||[]).forEach(function(it){if(it.id===id)r=it})})});return r;
}

      '<style id="app-style">'+APP_STYLE+'</style></head>\n<body><div id="app"></div><div id="overlay-root"></div>\n'+

}

var DRAFT='mk-teacher-site-draft';
var STATIC_ASSETS={upload:function(f,o){
  return new Promise(function(res,rej){
    var t=(o&&o.type)||'';
    if(t.indexOf('image/')!==0){rej({code:'static_file'});return}
    var rd=new FileReader();
    rd.onerror=function(){rej({code:'x'})};
    rd.onload=function(){
      var src=rd.result;
      if(t==='image/svg+xml'||t==='image/gif'){if(f.size>1500000){rej({code:'too_large'});return}res({url:src});return}
      var im=new Image();
      im.onload=function(){
        var m=1600,w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,m/Math.max(w,h));
        var c=D.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
        var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
        res({url:c.toDataURL('image/jpeg',0.8)});
      };
      im.onerror=function(){rej({code:'unsupported_type'})};
      im.src=src;
    };
    rd.readAsDataURL(f);
  });
}};
function save(){
  if(state.saving)return;
  if(STATIC){staticSave();return}
  if(!artifactNS||!RESET){toast('บันทึกได้เฉพาะเมื่อเปิดเว็บนี้ผ่าน Claude ด้วยบัญชีที่มีสิทธิ์แก้ไข');return}
  state.saving=true;render();
  var out=clone(data);out.sv=uid('v');
  try{sessionStorage.setItem(STASH,JSON.stringify({route:state.route,edit:true,tab:state.tab,pending:out}))}catch(e){}
  artifactNS.publish(buildDoc(out)).then(function(){toast('บันทึกแล้ว กำลังโหลดฉบับใหม่…')}).catch(function(err){
    var c=err&&err.code;
    if(c==='conflict'){toast('มีคนบันทึกฉบับใหม่ก่อนหน้านี้ หน้าเว็บกำลังโหลดฉบับล่าสุด');return}
    if(c==='upstream_error'&&!retried){retried=true;state.saving=false;setTimeout(save,800+Math.random()*900);return}
    try{sessionStorage.removeItem(STASH)}catch(e){}
    state.saving=false;
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){
      state.canEdit=false;state.editing=false;toast('บัญชีนี้ดูได้อย่างเดียว จึงบันทึกการแก้ไขไม่ได้');
    }else if(c==='rate_limited') toast('บันทึกถี่เกินไป รอสักครู่แล้วกดบันทึกอีกครั้ง');
    else if(c==='too_large') toast('ข้อมูลใหญ่เกินกำหนด ให้ย้ายไฟล์ใหญ่ไปไว้ใน Google Drive แล้วใช้ลิงก์แทน');
    else toast('บันทึกไม่สำเร็จ ลองกดบันทึกอีกครั้ง');
    render();
  });
}

    var ra=t.closest('[data-row-add]');if(ra){var kind=ra.getAttribute('data-row-add');if(kind==='images'){var im=readImages();im.push({url:'',cap:''});D.getElementById('f-images').innerHTML=im.map(imgRow).join('')}else{var cs=readCodes();cs.push({name:'',lang:'cpp',src:''});D.getElementById('f-codes').innerHTML=cs.map(codeRow).join('')}return}
    var rd=t.closest('[data-row-del]');if(rd){var kd=rd.getAttribute('data-row-del'),ix=+rd.getAttribute('data-i');if(kd==='images'){var im2=readImages();im2.splice(ix,1);D.getElementById('f-images').innerHTML=im2.map(imgRow).join('')}else{var cs2=readCodes();cs2.splice(ix,1);D.getElementById('f-codes').innerHTML=cs2.map(codeRow).join('')}return}
    var md2=t.closest('[data-mdel]');if(md2&&formCfg&&formCfg.onDelete){if(!armed(md2,'กดอีกครั้งเพื่อยืนยันลบ'))return;formCfg.onDelete();closeForm();commit();window.scrollTo(0,0);return}
    return;
  }
  var hit=t.closest('[data-hit]');
  if(hit){e.preventDefault();var p=hit.getAttribute('data-hit').split('|');openHit(p[0],+p[1],p[2]);return}
  var go=t.closest('[data-go]');
  if(go){e.preventDefault();goTo(go.getAttribute('data-go'));return}
  var b=t.closest('[data-act]');
  if(b){if(b.tagName==='A')e.preventDefault();act(b);return}
  if(state.menu&&!t.closest('.dd-panel,.mnav')){state.menu=null;render()}
});
D.addEventListener('input',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='q'){state.q=t.value;renderResults();return}
  if(t.id==='f-url'&&t.value.indexOf('/_blob/')!==0){var fn=D.getElementById('f-fileName');if(fn)fn.value=''}
});
D.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='f-file'){onFile(t);return}
  if(t.id==='qs'){state.qScope=t.value;renderResults()}
});
D.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(D.querySelector('[data-lb]')){D.getElementById('overlay-root').innerHTML='';return}if(formCfg)closeForm();else if(state.menu){state.menu=null;render()}return}
  if(e.key==='Enter'&&e.target&&e.target.id==='q'){e.preventDefault();var hs=searchHits();if(hs[0])openHit(hs[0].sid,hs[0].si,hs[0].id)}
});
D.addEventListener('submit',function(e){
  if(e.target.id!=='mform')return;e.preventDefault();if(!formCfg)return;
  var v=collect(),err=formCfg.onSave(v);
  if(err){D.getElementById('m-msg').textContent=err;return}
  closeForm();commit();
});

render();

/* ---------- capabilities: editing only for people who can edit this artifact ---------- */
if(STATIC){
  if(/[?&]edit(=|&|$)/.test(location.search)){
    state.canEdit=true;state.editing=true;assetsNS=STATIC_ASSETS;
    try{var dr=JSON.parse(localStorage.getItem(DRAFT)||'null');if(dr&&dr.base===data.sv&&dr.data){data=dr.data;state.dirty=dr.dirty||1}}catch(e){}
    render();
    setInterval(function(){if(!state.dirty)return;try{localStorage.setItem(DRAFT,JSON.stringify({base:JSON.parse(savedJSON).sv,data:data,dirty:state.dirty}))}catch(e){}},3000);
    window.addEventListener('beforeunload',function(e){if(state.dirty){e.preventDefault();e.returnValue=''}});
  }
}else if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    artifactNS=r[0];var user=r[1];
    if(!artifactNS||!user)return null;
    return user.canEdit();
  }).then(function(ok){
    if(!ok)return;
    state.canEdit=true;
    if(stash&&stash.edit)state.editing=true;
    render();
    window.claude.use('assets').then(function(a){assetsNS=a}).catch(function(){});
  }).catch(function(){});
}
})();
</script>
</body></html>
