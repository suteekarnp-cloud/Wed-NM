<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ครูมนณัชญ์ กุลวรรณ</title><meta name="description" content="แผนกวิชาช่างอิเล็กทรอนิกส์ · วิทยาลัยเทคนิคประจวบคีรีขันธ์ · ภาคเรียน 2/2569"><meta property="og:title" content="ครูมนณัชญ์ กุลวรรณ"><meta property="og:description" content="แผนกวิชาช่างอิเล็กทรอนิกส์ · วิทยาลัยเทคนิคประจวบคีรีขันธ์ · ภาคเรียน 2/2569"><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%233d72b6%22%2F%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%2216%22%20r%3D%227%22%20fill%3D%22%2374d61b%22%2F%3E%3Cpath%20d%3D%22M16%2046V20l16%2016%2016-16v26%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"><style id="reset">:root{color-scheme:light dark}*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img,svg,video{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
/* Layout: sky-blue cinematic hero with overlaid nav -> one dark "classroom app" window -> tight bento grid of colour-block cards (blue, near-black UI, one lime action card) -> footer with a giant dotted wordmark */
:root{
  --page:#edf2f5; --card:#ffffff; --fg:#0b1730; --muted:#55657d; --line:#d8e1ea; --soft:#f4f7fa;
  --sky:#3d72b6; --sky-2:#4f86c8; --sky-3:#9cc0e6; --navy:#071b43; --on-blue:#ffffff; --on-blue-2:rgba(255,255,255,.8); --glass:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.28);
  --lime:#74d61b; --on-lime:#0b1406; --warn:#c0362c; --amber:#b98a00;
  --ui:#101112; --ui-2:#18191c; --ui-3:#212327; --ui-line:#2b2e33; --ui-fg:#e8ebef; --ui-muted:#8d949d;
  --tk:#c4a7ff; --ts:#a6e36f; --tn:#ffb86b; --tc:#6f7782; --tp:#82b4ff;
  --note:#e8f1fb; --note-line:#bcd3ee;
  --scrim:rgba(7,27,67,.55); --shadow:0 24px 60px -30px rgba(7,27,67,.45);
  --f-sans:"Anuphan","IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#06112a; --card:#0d1b38; --fg:#e9f0f8; --muted:#9fb0c8; --line:#1f3157; --soft:#11234a;
  --sky:#2f62a6; --sky-2:#3d72b6; --sky-3:#5b8fcd; --navy:#030b1f; --glass:rgba(255,255,255,.1); --glass-line:rgba(255,255,255,.22);
  --note:#10284f; --note-line:#244a80; --warn:#ff7b6e; --amber:#e6c34a;
  --scrim:rgba(0,0,0,.66); --shadow:0 24px 60px -30px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#06112a; --card:#0d1b38; --fg:#e9f0f8; --muted:#9fb0c8; --line:#1f3157; --soft:#11234a;
  --sky:#2f62a6; --sky-2:#3d72b6; --sky-3:#5b8fcd; --navy:#030b1f; --glass:rgba(255,255,255,.1); --glass-line:rgba(255,255,255,.22);
  --note:#10284f; --note-line:#244a80; --warn:#ff7b6e; --amber:#e6c34a;
  --scrim:rgba(0,0,0,.66); --shadow:0 24px 60px -30px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--page);color:var(--fg);font-family:var(--f-sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sky)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
img{display:block;max-width:100%}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;line-height:1.4;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--sky)}
.mono,.code{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 22px;font-weight:600;font-size:14px;line-height:1.2;border:1px solid transparent;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .15s,filter .15s}
.pill:hover{transform:translateY(-1px)}
.pill-lg{padding:14px 28px;font-size:15px}
.pill-sm{padding:7px 15px;font-size:13px}
.pill-white{background:#ffffff;color:var(--navy)}
.pill-glass{background:var(--glass);color:#fff;border-color:var(--glass-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill-glass:hover{background:rgba(255,255,255,.22)}
.pill-black{background:#0b0c0d;color:#fff}
.pill-lime{background:var(--lime);color:var(--on-lime)}
.pill-dark,.pill-blue{background:var(--sky);color:#fff}
.pill-ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.pill-ghost:hover{border-color:var(--sky)}
.pill[disabled]{opacity:.5;cursor:default;transform:none}

/* sky backdrop (hero + page headers) */
.sky{position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,#2c62a8 0%,#4f86c8 48%,#8db6e3 100%)}
.sky::before{content:"";position:absolute;inset:-20% -10% auto;height:120%;pointer-events:none;opacity:.55;
  background:radial-gradient(38% 28% at 18% 72%,rgba(255,255,255,.55),transparent 70%),radial-gradient(30% 22% at 70% 80%,rgba(255,255,255,.45),transparent 70%),radial-gradient(26% 18% at 88% 30%,rgba(255,255,255,.28),transparent 70%),radial-gradient(22% 16% at 40% 18%,rgba(255,255,255,.18),transparent 70%)}
.sky::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.sky>*{position:relative;z-index:1}

/* nav (overlaid on the sky) */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;color:#fff;background:#2c62a8;background:color-mix(in srgb,#2c62a8 88%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid rgba(255,255,255,.12)}
.nav-in{display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex:none;max-width:40%}
.mark{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.brand-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:2px;min-width:0}
.nl{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.82);text-decoration:none;white-space:nowrap;transition:color .15s,background .15s}
.nl:hover{color:#fff;background:rgba(255,255,255,.12)}
.nl.is-on{color:#fff;background:rgba(255,255,255,.18)}
.nav-r{display:flex;align-items:center;gap:8px;flex:none}
.burger{display:none;width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.3);align-items:center;justify-content:center;color:#fff}
.dd{position:relative}
.dd-panel{position:absolute;top:calc(100% + 10px);right:0;width:min(460px,88vw);background:var(--ui);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:grid}
.dd-i{display:grid;grid-template-columns:6.4rem 1fr;gap:12px;align-items:baseline;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14px;line-height:1.45}
.dd-i .code{font-size:12px;color:var(--lime)}
.dd-i:hover,.dd-i.is-on{background:var(--ui-3)}
.dd-add{margin-top:4px;padding:10px 12px;border-radius:10px;border:1px dashed var(--ui-line);color:var(--ui-muted);font-size:14px;text-align:left}
.mnav{border-top:1px solid rgba(255,255,255,.15);max-height:calc(100vh - 60px);overflow:auto}
.mnav-in{display:grid;gap:2px;padding-block:10px 18px}
.mnav .nl{justify-content:flex-start;font-size:16px;padding:10px 12px;border-radius:10px}
.mnav .eyebrow{padding:14px 12px 4px;color:rgba(255,255,255,.7)}
.mnav .dd-i .code{color:#d9f7b8}
.mnav .dd-i:hover,.mnav .dd-i.is-on{background:rgba(255,255,255,.12)}
@media (max-width:1000px){.nav-links{display:none}.burger{display:inline-flex}.brand{max-width:60%}.nav-r{margin-left:auto}}

/* edit strip */
.estrip{background:#e9f9d9;color:#1d3a05;font-size:14px;line-height:1.55;border-bottom:1px solid #c9eda4}
.estrip-in{display:flex;gap:10px;align-items:flex-start;padding-block:10px}
.estrip .dot{width:8px;height:8px;border-radius:50%;background:#4a9a0b;margin-top:7px;flex:none;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.conflict{border-bottom:1px solid var(--line);background:var(--card)}
.conflict-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px;font-size:14px}
.conflict-in p{flex:1 1 280px}

/* hero */
.hero-in{text-align:center;padding-block:clamp(56px,9vw,120px) clamp(120px,14vw,190px);display:grid;justify-items:center;gap:22px}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:5px 14px 5px 6px;font-size:13px;color:#fff;max-width:100%;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.badge b{background:var(--lime);color:var(--on-lime);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.display{font-size:clamp(2.6rem,7.6vw,6.2rem);line-height:1.1;font-weight:700;letter-spacing:-.015em;max-width:15ch;text-shadow:0 2px 30px rgba(7,27,67,.18)}
.display .l2{display:block;font-weight:500;color:rgba(255,255,255,.88)}
.tag-in{display:inline-flex;align-items:center;gap:.25em;vertical-align:.18em;font-size:.36em;font-weight:600;line-height:1;padding:.45em .8em;border-radius:999px;background:#fff;color:var(--navy);letter-spacing:0;margin-inline:.12em;box-shadow:0 6px 20px -10px rgba(7,27,67,.5)}
.tag-in i{width:.55em;height:.55em;border-radius:50%;display:inline-block}
.lede{max-width:40rem;color:var(--on-blue-2);font-size:clamp(1rem,1.6vw,1.12rem)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.edit-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* classroom app window */
.showcase{margin-top:calc(-1 * clamp(90px,11vw,150px));position:relative;z-index:2}
.app{background:var(--ui);color:var(--ui-fg);border-radius:22px;border:1px solid var(--ui-line);box-shadow:0 40px 80px -40px rgba(7,27,67,.7);overflow:hidden}
.app-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ui-line);background:var(--ui-2)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a3d42}
.dots i:nth-child(1){background:#ff6058}.dots i:nth-child(2){background:#ffbd2e}.dots i:nth-child(3){background:#28c941}
.app-title{font-size:13px;color:var(--ui-muted);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-bar .st{font-family:var(--f-mono);font-size:11px;color:var(--lime);display:flex;align-items:center;gap:6px}
.app-bar .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.app-body{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;min-height:420px}
.app-side{border-right:1px solid var(--ui-line);padding:14px 10px;display:grid;align-content:start;gap:2px}
.app-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ui-muted);padding:6px 10px 8px;font-weight:600}
.app-side a{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-decoration:none;font-size:13px;line-height:1.35}
.app-side a:hover{background:var(--ui-3)}
.app-side .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:#0b1406}
.app-side small{display:block;color:var(--ui-muted);font-family:var(--f-mono);font-size:10.5px}
.app-main{padding:16px;display:grid;align-content:start;gap:12px;min-width:0}
.sbox{border:1px solid var(--ui-line);border-radius:14px;background:var(--ui-2);transition:border-color .15s,box-shadow .15s}
.sbox:focus-within{border-color:var(--sky-2);box-shadow:0 0 0 3px rgba(79,134,200,.3)}
.sbox input{width:100%;border:0;background:transparent;padding:14px 16px 8px;font-size:16px;outline:none;color:var(--ui-fg)}
.sbox input::placeholder{color:var(--ui-muted)}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 8px 8px 12px}
.sbar select{border:1px solid var(--ui-line);background:var(--ui-3);color:var(--ui-fg);border-radius:8px;padding:5px 9px;font-size:12px;max-width:70%}
.sgo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ui-3);color:var(--ui-muted);border:1px solid var(--ui-line);transition:background .15s,color .15s}
.sgo.is-on{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.shint{font-size:11.5px;color:var(--ui-muted)}
.shint kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--ui-2)}
.feed{display:grid;gap:2px}
.feed a{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 12px;text-decoration:none;border-radius:10px}
.feed a:hover,.feed a:focus-visible{background:var(--ui-3)}
.feed .code{grid-row:span 2;font-size:11px;color:var(--lime);padding-top:3px;min-width:5.6rem}
.feed b{font-weight:600;font-size:14px;line-height:1.45}
.feed small{color:var(--ui-muted);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed .none{padding:12px;color:var(--ui-muted);font-size:14px}
.app-aside{border-left:1px solid var(--ui-line);padding:14px;display:grid;align-content:start;gap:10px}
.today{display:grid;gap:8px}
.tslot{border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px;background:var(--ui-2);display:grid;gap:2px;text-decoration:none}
.tslot:hover{border-color:var(--sky-2)}
.tslot .mono{font-size:11.5px;color:var(--tp)}
.tslot b{font-size:13.5px;font-weight:600;line-height:1.4}
.tslot small{font-size:12px;color:var(--ui-muted)}
.term{grid-column:1/-1;border-top:1px solid var(--ui-line);background:#0b0c0d;font-family:var(--f-mono);font-size:12px;line-height:1.7;padding:10px 16px;color:var(--ui-muted);overflow-x:auto;white-space:nowrap}
.term .ok{color:var(--lime)}.term .hl{color:var(--ui-fg)}
@media (max-width:980px){.app-body{grid-template-columns:minmax(0,1fr)}.app-side{display:none}.app-aside{border-left:0;border-top:1px solid var(--ui-line)}}

/* bento */
.bento-wrap{padding-block:clamp(18px,3vw,28px) clamp(56px,7vw,96px)}
.bento-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin:clamp(40px,6vw,72px) 0 18px}
.bento-head h2{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.bento-head p{color:var(--muted);max-width:30rem}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.bc{border-radius:20px;padding:22px;min-width:0;display:grid;gap:14px;align-content:start;position:relative;overflow:hidden;transition:transform .2s,filter .2s;text-decoration:none}
a.bc:hover{transform:translateY(-3px);filter:brightness(1.05)}
.b-blue{background:var(--sky);color:#fff}
.b-blue::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.2px);background-size:14px 14px;-webkit-mask-image:linear-gradient(200deg,#000,transparent 55%);mask-image:linear-gradient(200deg,#000,transparent 55%)}
.b-blue>*{position:relative;z-index:1}
.b-dark{background:var(--ui);color:var(--ui-fg)}
.b-lime{background:var(--lime);color:var(--on-lime)}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media (max-width:980px){.s2,.s3{grid-column:span 3}.s4{grid-column:span 6}}
@media (max-width:640px){.s2,.s3,.s4,.s6{grid-column:span 6}}
.bc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bc-code{font-family:var(--f-mono);font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.b-dark .bc-code{background:var(--ui-3);border-color:var(--ui-line);color:var(--lime)}
.bc-meta{font-size:12px;opacity:.85}
.bc h3{font-size:clamp(1.25rem,2.2vw,1.55rem);font-weight:600;line-height:1.3}
.bc p{font-size:14px;opacity:.88;line-height:1.6}
.big{font-size:clamp(3.4rem,7vw,5.2rem);font-weight:700;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:.24em;font-weight:500;letter-spacing:0;opacity:.85;margin-left:.3em}
.mini{background:var(--ui);color:var(--ui-fg);border-radius:12px;border:1px solid rgba(255,255,255,.12);overflow:hidden;font-family:var(--f-mono);font-size:11.5px;line-height:1.65}
.mini-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--ui-line);color:var(--ui-muted);font-size:10.5px}
.mini-bar .dots i{width:8px;height:8px}
.mini pre{margin:0;padding:10px 12px;overflow:hidden;white-space:pre;max-height:11.5em}
.mini ol{margin:0;padding:10px 12px 10px 2.4em;display:grid;gap:2px;font-family:var(--f-sans);font-size:12.5px}
.mini ol li::marker{color:var(--ui-muted);font-family:var(--f-mono);font-size:11px}
.bc-foot{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.bc-foot span{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.b-dark .bc-foot span{background:var(--ui-3);color:var(--ui-muted)}
.arrow{position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);transition:transform .2s;z-index:2}
a.bc:hover .arrow{transform:translateX(3px)}
.bc-add{border:2px dashed var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;min-height:160px;font-size:15px}
/* teacher card */
.teach{grid-template-columns:auto minmax(0,1fr);align-items:center}
.teach-ph{width:112px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
.teach-ph img{width:100%;height:100%;object-fit:cover}
.teach ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;opacity:.92;grid-column:1/-1}
.teach li{display:flex;gap:8px;align-items:baseline}
.teach li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime);flex:none;transform:translateY(-2px)}
/* lime card */
.b-lime h3{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;letter-spacing:-.01em}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14.5px;font-weight:500}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.checks svg{margin-top:3px}
/* carousel */
.car{position:relative;border-radius:14px;overflow:hidden;background:rgba(0,0,0,.18);aspect-ratio:16/9}
.car-track{display:flex;height:100%;transition:transform .5s ease}
.car-slide{flex:0 0 100%;height:100%;position:relative}
.car-slide img{width:100%;height:100%;object-fit:cover}
.car-slide figcaption{position:absolute;left:10px;bottom:10px;right:10px;font-size:12.5px;background:rgba(7,27,67,.72);color:#fff;border-radius:10px;padding:6px 10px;backdrop-filter:blur(4px)}
.car-dots{display:flex;gap:6px;justify-content:center}
.car-dots button{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.4);transition:width .2s,background .2s}
.car-dots button.is-on{width:22px;background:#fff}
/* timetable inside dark card */
.tt-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:end}
.tt-head h3{font-size:clamp(1.25rem,2.2vw,1.55rem);font-weight:600}
.tt-note{color:var(--ui-muted);font-size:12.5px}
.tt-scroll{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tt-grid{display:grid;grid-template-columns:4.4rem repeat(var(--units),minmax(1.45rem,1fr));row-gap:6px;min-width:46rem}
.tt-h{grid-row:1;font-family:var(--f-mono);font-size:10.5px;color:var(--ui-muted);padding:0 0 4px 2px}
.tt-d{grid-column:1;align-self:center;font-weight:600;font-size:13px}
.tt-row{grid-column:2/-1;height:66px;border:1px solid var(--ui-line);border-radius:10px;background-image:linear-gradient(to right,var(--ui-line) 1px,transparent 1px);background-size:calc(100% / var(--hours)) 100%;background-position:-1px 0}
.tt-lunch{z-index:1;margin:0 1px;border-radius:9px;background-color:var(--ui);background-image:repeating-linear-gradient(135deg,var(--ui-line) 0 1px,transparent 1px 7px);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-size:11px;color:var(--ui-muted)}
.tt-b{z-index:2;margin:5px 3px;border-radius:8px;background:var(--sky-2);color:#fff;padding:6px 9px;display:flex;flex-direction:column;justify-content:center;gap:0;min-width:0;text-decoration:none;font-size:11.5px;line-height:1.35;overflow:hidden;transition:transform .15s,filter .15s}
.tt-b:hover{transform:translateY(-2px);filter:brightness(1.1)}
.tt-b b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.tt-b.k1{background:#4f86c8}.tt-b.k2{background:#7a5af8}.tt-b.k3{background:#e08a1e}.tt-b.k4{background:#14a37f}.tt-b.k0{background:#74d61b;color:#0b1406}

/* inner page header */
.ph{padding-block:clamp(36px,6vw,72px) clamp(36px,5vw,60px)}
.ph-in{display:grid;gap:14px;justify-items:start}
.ph-split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;width:100%}
.ph-photo{width:140px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.ph-photo img{width:100%;height:100%;object-fit:cover}
@media (max-width:600px){.ph-split{grid-template-columns:minmax(0,1fr)}.ph-photo{width:110px}}
.crumbs{font-size:13px;color:var(--on-blue-2);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:#fff;text-decoration:underline}
.code-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--glass-line);border-radius:999px;padding:4px 12px;font-family:var(--f-mono);font-size:13px;background:var(--glass)}
.h-page{font-size:clamp(2.1rem,5.6vw,4.4rem);line-height:1.1;font-weight:700;letter-spacing:-.015em;max-width:22ch}
.h-page em{display:block;font-style:normal;font-weight:500;font-size:.38em;line-height:1.5;margin-top:.5em;color:var(--on-blue-2);letter-spacing:0}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.slot{display:inline-flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;border:1px solid var(--glass-line);border-radius:12px;padding:7px 12px;font-size:13px;background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.slot b{font-weight:600}
.slot .mono{font-size:12px}
.slot i{font-style:normal;opacity:.82}

/* tabs (segmented pills on the page background) */
.tabbar{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:20;background:var(--page);background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--fg)}
.tab.is-on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--soft);border-radius:999px;padding:0 7px;color:var(--muted)}
.tab.is-on .cnt{background:var(--lime);color:var(--on-lime)}
.tab-add{color:var(--sky);font-size:14px;padding:9px 12px;white-space:nowrap;font-weight:600}
.tabpanel{padding-block:8px clamp(48px,6vw,80px)}
.panel-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:14px;background:var(--card)}
.panel-tools span{font-size:13px;color:var(--muted);margin-right:auto}

/* accordion */
.acc-list{display:grid;gap:10px}
.acc{border-radius:18px;background:var(--card);border:1px solid transparent;transition:border-color .15s,box-shadow .15s;scroll-margin-top:130px}
.acc.is-open{border-color:var(--line);box-shadow:var(--shadow)}
.acc-btn{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;text-align:left;border-radius:18px}
.acc-btn:hover .acc-title{color:var(--sky)}
.acc-idx{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500;background:var(--soft);color:var(--muted)}
.acc.is-open .acc-idx{background:var(--sky);color:#fff}
.ws.acc.is-open .acc-idx{background:var(--lime);color:var(--on-lime)}
.acc-tt{display:grid;gap:2px;min-width:0}
.acc-title{font-weight:600;font-size:1.08rem;line-height:1.45;transition:color .15s}
.acc-desc{color:var(--muted);font-size:14px;line-height:1.55}
.acc-chev{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--soft);transition:transform .2s}
.acc.is-open .acc-chev{transform:rotate(180deg);color:var(--sky)}
.acc-body{padding:4px 20px 22px calc(20px + 40px + 16px);display:grid;gap:18px;min-width:0}
@media (max-width:640px){.acc-btn{gap:12px;padding:16px}.acc-idx{width:34px;height:34px}.acc-body{padding:4px 16px 18px}}

/* markdown */
.md{display:grid;gap:12px;min-width:0;max-width:52rem;line-height:1.75}
.md h4{font-size:1.06rem;font-weight:700;margin-top:10px}
.md ul,.md ol{margin:0;padding-left:1.3rem;display:grid;gap:4px}
.md li::marker{color:var(--sky)}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.md a{color:var(--sky);text-underline-offset:3px}
.md strong{font-weight:600}
.note{border:1px solid var(--note-line);background:var(--note);border-radius:12px;padding:12px 14px;font-size:15px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--soft);font-weight:600;font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}

/* figures & gallery */
.figs{display:grid;gap:14px}
.fig{margin:0;display:grid;gap:8px}
.fig-btn{display:block;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in}
.fig-btn img{width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gal .fig-btn{aspect-ratio:4/3;background:var(--soft);border:0;border-radius:18px}
.gal .fig-btn img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gal .fig-btn:hover img{transform:scale(1.03)}
@media (max-width:820px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.gal{grid-template-columns:minmax(0,1fr)}}

/* code editor (dark, technical) */
.codebox{border:1px solid var(--ui-line);border-radius:14px;overflow:hidden;background:var(--ui);color:var(--ui-fg);min-width:0}
.cb-head{display:flex;align-items:center;gap:6px;background:var(--ui-2);border-bottom:1px solid var(--ui-line);padding:0 8px 0 12px;min-height:42px;flex-wrap:wrap}
.cb-head .dots{margin-right:6px}.cb-head .dots i{width:9px;height:9px}
.cb-tab{font-family:var(--f-mono);font-size:12px;padding:10px 10px 9px;color:var(--ui-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.cb-tab.is-on{color:var(--ui-fg);border-bottom-color:var(--lime);background:var(--ui)}
.cb-sp{flex:1}
.cb-lang{font-size:11px;font-weight:600;color:var(--on-lime);background:var(--lime);border-radius:999px;padding:2px 9px}
.cb-copy{font-size:12px;border:1px solid var(--ui-line);border-radius:999px;padding:4px 12px;background:var(--ui-3);color:var(--ui-fg)}
.cb-copy:hover{border-color:var(--lime)}
.cb-pre{margin:0;padding:14px 16px;overflow:auto;max-height:520px;font-family:var(--f-mono);font-size:13px;line-height:1.65;tab-size:4}
.tk{color:var(--tk)}.ts{color:var(--ts)}.tn{color:var(--tn)}.tc{color:var(--tc);font-style:italic}.tp{color:var(--tp)}
.attach{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* generic sections (profile pages) */
.page-body{padding-block:clamp(20px,3vw,32px) clamp(48px,6vw,80px);display:grid;gap:12px}
.sec{padding:22px;border-radius:20px;background:var(--card);display:grid;gap:14px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.sec-t{font-size:clamp(1.2rem,2.2vw,1.45rem);font-weight:700;line-height:1.35}
.sec-note{color:var(--muted);max-width:44rem}
.ex{display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;line-height:1.6;font-weight:600;padding:0 8px;border-radius:999px;background:#fff3c4;color:#6b5100;white-space:nowrap}
.nofile{font-size:12px;color:var(--muted);white-space:nowrap}
.open{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:7px 14px;text-decoration:none;white-space:nowrap;background:var(--navy);color:#fff;transition:filter .15s;max-width:100%}
.open span{overflow:hidden;text-overflow:ellipsis}
.open:hover{filter:brightness(1.25)}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lcard{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px;border:1px solid var(--line);border-radius:14px;min-width:0}
.lc-main{display:grid;gap:6px;min-width:0}
.lc-t{font-weight:600;line-height:1.45}
.lc-d{color:var(--muted);font-size:14px;line-height:1.6}
@media (max-width:640px){.cards2{grid-template-columns:minmax(0,1fr)}}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0;padding-top:4px}
.row-main{flex:1;min-width:0;display:grid;gap:3px}
.row-t{font-weight:600;line-height:1.5}
.row-d{color:var(--muted);font-size:14px;line-height:1.6}
.row-act{flex:none;max-width:45%}
.num{flex:none;width:2.6rem;font-family:var(--f-mono);font-size:1rem;color:var(--muted);line-height:1.6}
@media (max-width:560px){.row{flex-wrap:wrap}.row-act{max-width:100%}}
.info{margin:0}
.info-r{display:grid;grid-template-columns:12rem minmax(0,1fr);gap:6px 24px;padding:13px 0;border-top:1px solid var(--line)}
.info-r:first-child{border-top:0;padding-top:4px}
.info-r dt{color:var(--muted);font-size:14px;line-height:1.7}
.info-r dd{margin:0;font-weight:500;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0;overflow-wrap:anywhere}
@media (max-width:600px){.info-r{grid-template-columns:minmax(0,1fr)}}
.prose{display:grid;gap:18px;max-width:44rem}
.prose h3{font-size:1.08rem;font-weight:600;margin-bottom:6px}
.prose p{line-height:1.85}
.panel{background:var(--ui);color:var(--ui-fg);border-radius:20px;padding:clamp(22px,4vw,40px)}
.cta{display:grid;gap:14px}
.cta-t{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:700;line-height:1.25}
.cta-note{color:var(--ui-muted)}
.cta-items{display:grid;gap:14px}
.cta-item{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.cta-d{color:var(--ui-muted);font-size:14px;flex-basis:100%}
.pill-inv{background:var(--lime);color:var(--on-lime)}
.pill-inv-ghost{background:transparent;color:var(--ui-fg);border-color:var(--ui-line)}
.empty{color:var(--muted);font-size:14px}
.refs{margin-top:22px;padding:20px 22px;border-radius:18px;background:var(--card);display:grid;gap:10px}
.refs h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);font-weight:600}
.refs ol{margin:0;padding-left:1.3rem;display:grid;gap:6px;font-size:14px;color:var(--muted);line-height:1.6}
.refs a{color:var(--fg);overflow-wrap:anywhere;text-underline-offset:3px}

/* edit controls */
.tools{display:inline-flex;flex-wrap:wrap;gap:4px;position:relative;z-index:3}
.tbtn{font-size:12px;line-height:1.3;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);white-space:nowrap}
.tbtn:hover{border-color:var(--sky)}
.tbtn.is-armed{border-color:var(--warn);color:var(--warn)}
.tbtn:disabled{opacity:.35;cursor:default}
.sky .tbtn,.b-blue .tbtn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.panel .tbtn,.b-dark .tbtn{background:transparent;border-color:var(--ui-line);color:var(--ui-fg)}
.add{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14px;background:transparent;transition:color .15s,border-color .15s}
.add:hover{color:var(--sky);border-color:var(--sky)}
.add-sec{margin-top:4px;text-align:center;padding:16px}
.add-sm{width:auto;display:inline-block;padding:8px 14px;margin-top:6px}

/* prev/next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:clamp(48px,7vw,88px)}
.pn-a{display:grid;gap:4px;padding:20px 22px;border-radius:18px;text-decoration:none;min-width:0;background:var(--sky);color:#fff;transition:transform .2s,filter .2s}
.pn-a:hover{transform:translateY(-2px);filter:brightness(1.06)}
.pn-a .eyebrow{color:rgba(255,255,255,.8)}
.pn-a b{font-weight:600;line-height:1.45}
.pn-a.next{text-align:right}
@media (max-width:560px){.pn{grid-template-columns:minmax(0,1fr)}.pn-a.next{text-align:left}}

/* footer with giant wordmark */
.foot{padding-top:28px;overflow:hidden;background:var(--page)}
.foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 32px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot-links a{text-decoration:none}
.foot-links a:hover{color:var(--fg)}
.wordmark{font-weight:700;line-height:.82;letter-spacing:-.04em;font-size:clamp(4.2rem,17vw,15rem);white-space:nowrap;text-align:center;margin:clamp(24px,4vw,40px) 0 calc(-1 * clamp(10px,2vw,26px));
  background-image:radial-gradient(circle,var(--sky-2) 42%,transparent 46%);background-size:9px 9px;-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.wordmark{color:var(--sky-3)}}

/* save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.savebar-in{pointer-events:auto;max-width:780px;margin-inline:auto;background:var(--ui);color:var(--ui-fg);border:1px solid var(--ui-line);border-radius:999px;padding:8px 8px 8px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;box-shadow:var(--shadow)}
.savebar-in p{flex:1 1 220px;font-size:14px}
.has-savebar .foot{padding-bottom:100px}

/* modal + lightbox */
.modal-bg{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:22px;display:grid;box-shadow:var(--shadow)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px 0}
.m-head h3{font-size:1.2rem;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;line-height:1;background:var(--card)}
.m-body{padding:16px 22px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.field{grid-column:1/-1;display:grid;gap:6px;min-width:0}
.field.third{grid-column:span 2}
.field.half{grid-column:span 3}
.field>label,.field>.lbl{font-size:13px;font-weight:600}
.field b{color:var(--warn);font-weight:600}
.field input[type=text],.field input[type=url],.field input[type=number],.field input[type=time],.field select,.field textarea,.rowed input,.rowed select,.rowed textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--page);color:var(--fg);font-size:15px;line-height:1.5;min-width:0}
.field textarea,.rowed textarea{resize:vertical;font-size:14px}
.rowed textarea{font-family:var(--f-mono);font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus,.rowed :focus{outline:2px solid var(--sky);outline-offset:0;border-color:var(--sky)}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.upl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.upl-msg{font-size:13px;color:var(--muted)}
.rows-ed{display:grid;gap:10px}
.rowed{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.rowed-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.slot-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr auto;gap:6px;align-items:center}
.slot-row select,.slot-row input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--fg);font-size:14px;min-width:0}
@media (max-width:560px){.slot-row{grid-template-columns:1fr 1fr 1fr}.field.half,.field.third{grid-column:1/-1}.rowed-top{grid-template-columns:minmax(0,1fr)}}
.m-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.m-msg{flex:1 1 160px;font-size:13px;color:var(--warn)}
.m-foot .left{margin-right:auto}
.lb{position:fixed;inset:0;z-index:55;background:rgba(3,11,31,.9);display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb figure{margin:0;display:grid;gap:10px;max-width:min(1100px,100%);max-height:100%}
.lb img{max-height:calc(100vh - 120px);width:auto;max-width:100%;border-radius:12px;background:#fff;margin-inline:auto}
.lb figcaption{color:#e6edf6;text-align:center;font-size:14px}
.lb .icon-btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:#0d1b38;color:#fff;border-color:#244a80}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ui);color:var(--ui-fg);padding:10px 18px;border-radius:999px;font-size:14px;max-width:min(92vw,560px);text-align:center;box-shadow:var(--shadow)}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
/* mobile overflow fixes */
.hero-in,.app-main,.app-aside,.today,.feed{grid-template-columns:minmax(0,1fr)}
.hero-in>*{max-width:100%}
.badge{flex-wrap:wrap;justify-content:center;row-gap:4px}
.badge>span{min-width:0;white-space:normal}
.sbox input,.sbox select{width:100%;min-width:0;max-width:100%}
.sbar{min-width:0}
@media (max-width:520px){.display{font-size:clamp(2.1rem,10.5vw,2.8rem)}.badge{font-size:12px;border-radius:16px}}</style></head>
