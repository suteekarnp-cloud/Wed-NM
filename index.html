ัสเทียม (Pseudocode)\n3. **เขียนโปรแกรม** แปลงอัลกอริทึมเป็นภาษาคอมพิวเตอร์ ในรายวิชานี้ใช้ภาษาซี\n4. **ทดสอบและแก้ไข** ป้อนข้อมูลหลายกรณี รวมถึงกรณีผิดปกติ แล้วแก้ข้อผิดพลาด (Debug)\n5. **จัดทำเอกสาร** เขียนคำอธิบายในโค้ด (Comment) และคู่มือการใช้งาน\n\n### อัลกอริทึม\nอัลกอริทึม (Algorithm) คือลำดับขั้นตอนที่ชัดเจน มีจุดเริ่มต้นและจุดสิ้นสุด และให้ผลลัพธ์เดิมทุกครั้งเมื่อข้อมูลเข้าเหมือนเดิม ตัวอย่างรหัสเทียมของการคำนวณกระแสไฟฟ้า\n\n1. เริ่มต้น\n2. รับค่าแรงดัน V และความต้านทาน R\n3. ถ้า R เท่ากับ 0 ให้แจ้งเตือนแล้วจบการทำงาน\n4. คำนวณ I = V / R\n5. แสดงค่า I\n6. จบการทำงาน\n\n### โครงสร้างควบคุม 3 แบบ\n- **แบบลำดับ (Sequence)** ทำงานเรียงทีละคำสั่ง\n- **แบบเลือกทำ (Selection)** ตรวจเงื่อนไขแล้วเลือกเส้นทาง\n- **แบบทำซ้ำ (Repetition)** ทำคำสั่งเดิมซ้ำจนกว่าเงื่อนไขจะเป็นเท็จ\n\n> ฝึกเขียนผังงานด้วยโปรแกรม Flowgorithm ได้ฟรี โปรแกรมจะรันผังงานให้ดูผลจริง ช่วยฝึกแนวคิดเชิงคำนวณก่อนเขียนโค้ด","code":[],"images":[{"url":"svg/prog-flowchart.svg","cap":"ภาพที่ 1 สัญลักษณ์ผังงาน และผังงานคำนวณกระแสไฟฟ้า (วาดใหม่)"}],"url":""},{"id":"pl2","title":"หน่วยที่ 2 โครงสร้างโปรแกรมภาษาซี ตัวแปร และชนิดข้อมูล","desc":"ส่วนประกอบของโปรแกรม การประกาศตัวแปร ชนิดข้อมูลพื้นฐาน และคำสั่งรับ-แสดงผล","body":"### ส่วนประกอบของโปรแกรมภาษาซี\n- **ส่วนหัว (Preprocessor)** เช่น `#include \u003cstdio.h>` เรียกใช้คลังคำสั่งมาตรฐาน\n- **ฟังก์ชัน main** จุดเริ่มต้นของโปรแกรม ทุกโปรแกรมต้องมี 1 ฟังก์ชัน\n- **คำสั่ง (Statement)** ทุกคำสั่งจบด้วยเครื่องหมาย `;`\n- **หมายเหตุ (Comment)** เขียนใน `/* ... */` หรือ `// ...` คอมไพเลอร์จะไม่นำไปประมวลผล\n\n### ชนิดข้อมูลพื้นฐาน\n| ชนิด | ใช้เก็บ | รหัสรูปแบบใน printf/scanf |\n|---|---|---|\n| int | จำนวนเต็ม | %d |\n| float | ทศนิยม (ความละเอียดประมาณ 6–7 หลัก) | %f |\n| double | ทศนิยมความละเอียดสูง | %lf (scanf) / %f (printf) |\n| char | ตัวอักษร 1 ตัว | %c |\n| char[] | ข้อความ (สตริง) | %s |\n\n> ขนาดของ int ขึ้นกับเครื่อง บนคอมพิวเตอร์ทั่วไปมีขนาด 4 ไบต์ แต่บน Arduino UNO มีขนาด 2 ไบต์ (เก็บได้ −32,768 ถึง 32,767) จึงต้องระวังเมื่อนำความรู้ไปเขียนโปรแกรมไมโครคอนโทรลเลอร์\n\n### กฎการตั้งชื่อตัวแปร\n- ขึ้นต้นด้วยตัวอักษรหรือ _ ตามด้วยตัวอักษร ตัวเลข หรือ _\n- ห้ามมีช่องว่าง และห้ามซ้ำกับคำสงวน เช่น int, if, for\n- ตัวพิมพ์ใหญ่และเล็กถือว่าต่างกัน และควรตั้งชื่อให้สื่อความหมาย เช่น `voltage` แทน `x`\n\n### การรับและแสดงผล\n`printf` แสดงผลทางหน้าจอ ส่วน `scanf` รับค่าจากแป้นพิมพ์ โดยต้องใส่ `&` หน้าชื่อตัวแปรเพื่อบอกตำแหน่งที่จะเก็บค่า และ `%.2f` คือแสดงทศนิยม 2 ตำแหน่ง","code":[{"name":"hello.c","lang":"c","src":"/* hello.c : โครงสร้างพื้นฐานของโปรแกรมภาษาซี */\n#include \u003cstdio.h>          /* เรียกใช้ฟังก์ชัน printf และ scanf */\n\nint main(void)              /* โปรแกรมเริ่มทำงานที่ฟังก์ชัน main */\n{\n    printf(\"Hello, Electronics!\\n\");\n    return 0;               /* คืนค่า 0 = จบโปรแกรมปกติ */\n}"},{"name":"ohm.c","lang":"c","src":"/* ohm.c : รับค่าแรงดันและความต้านทาน แล้วคำนวณกระแสตามกฎของโอห์ม */\n#include \u003cstdio.h>\n\nint main(void)\n{\n    float voltage, resistance, current;\n\n    printf(\"Voltage (V): \");\n    scanf(\"%f\", &voltage);\n    printf(\"Resistance (ohm): \");\n    scanf(\"%f\", &resistance);\n\n    current = voltage / resistance;               /* I = V / R */\n    printf(\"Current = %.4f A (%.2f mA)\\n\", current, current * 1000);\n    return 0;\n}"}],"images":[],"url":""},{"id":"pl3","title":"หน่วยที่ 3 ตัวดำเนินการและนิพจน์","desc":"ตัวดำเนินการทางคณิตศาสตร์ การเปรียบเทียบ ตรรกะ และข้อผิดพลาดจากการหารจำนวนเต็ม","body":"### ตัวดำเนินการที่ใช้บ่อย\n| กลุ่ม | ตัวดำเนินการ | ตัวอย่าง |\n|---|---|---|\n| คณิตศาสตร์ | + − * / % | `r = (vs - vf) / i;` |\n| เปรียบเทียบ | == != > \u003c >= \u003c= | `if (v >= 3.3)` |\n| ตรรกะ | `&&` (และ) `||` (หรือ) `!` (ไม่) | `if (v > 0 && r > 0)` |\n| กำหนดค่า | = += −= *= /= | `sum += x;` |\n| เพิ่ม-ลดค่า | ++ −− | `n++;` |\n\n### ลำดับความสำคัญ\nคอมพิวเตอร์คำนวณ วงเล็บ ก่อน แล้วจึงเป็น * / % ต่อด้วย + − เช่น `(vs - vf) / i` จะลบก่อนแล้วจึงหาร ถ้าไม่ใส่วงเล็บ `vs - vf / i` จะหาร vf ด้วย i ก่อน ได้ผลผิด\n\n### ข้อควรระวังเรื่องการหาร\n- จำนวนเต็มหารจำนวนเต็มจะได้จำนวนเต็ม เช่น `7 / 2` ได้ `3`\n- ต้องการทศนิยมให้แปลงชนิดก่อน เช่น `(float)7 / 2` ได้ `3.5`\n- `%` ใช้หาเศษจากการหาร ใช้ได้กับจำนวนเต็มเท่านั้น\n\n### ตัวอย่างงานอิเล็กทรอนิกส์\nคำนวณตัวต้านทานจำกัดกระแส LED จากสูตร R = (Vs − Vf) / I เมื่อแหล่งจ่าย 5 V, LED สีแดง Vf ≈ 2 V และกระแส 20 mA จะได้ R = 150 Ω แล้วเลือกใช้ค่ามาตรฐานที่ใกล้เคียงและสูงกว่า","code":[{"name":"led_resistor.c","lang":"c","src":"/* led_resistor.c : คำนวณค่าตัวต้านทานจำกัดกระแส LED และกำลังไฟฟ้า */\n#include \u003cstdio.h>\n\nint main(void)\n{\n    float vs = 5.0;      /* แรงดันแหล่งจ่าย (V) */\n    float vf = 2.0;      /* แรงดันตกคร่อม LED สีแดง (V) */\n    float i  = 0.020;    /* กระแส LED 20 mA */\n\n    float r = (vs - vf) / i;          /* R = (Vs - Vf) / I */\n    float p = (vs - vf) * i;          /* P = V x I ของตัวต้านทาน */\n\n    printf(\"R = %.1f ohm\\n\", r);\n    printf(\"P = %.3f W\\n\", p);\n\n    int a = 7, b = 2;\n    printf(\"7 / 2 = %d (int division)\\n\", a / b);   /* ได้ 3 ไม่ใช่ 3.5 */\n    printf(\"7 %% 2 = %d (remainder)\\n\", a % b);\n    printf(\"7.0 / 2 = %.1f\\n\", (float)a / b);\n    return 0;\n}"}],"images":[],"url":""},{"id":"pl4","title":"หน่วยที่ 4 คำสั่งเลือกทำ if และ switch-case","desc":"เขียนโปรแกรมตัดสินใจหลายทางด้วย if-else if และเมนูด้วย switch-case","body":"### รูปแบบคำสั่ง if\n- `if` ทำเมื่อเงื่อนไขเป็นจริง\n- `if ... else` เลือกทำอย่างใดอย่างหนึ่ง\n- `if ... else if ... else` เลือกได้หลายทาง โปรแกรมจะตรวจจากบนลงล่างและทำ **ทางแรก** ที่เป็นจริงเพียงทางเดียว\n\n### switch-case\nใช้เมื่อเลือกจากค่าที่เป็นจำนวนเต็มหรือตัวอักษร เช่น เมนู 1, 2, 3 ทุก case ต้องจบด้วย `break;` ไม่เช่นนั้นโปรแกรมจะทำ case ถัดไปต่อ ส่วน `default` ทำงานเมื่อไม่ตรงกับ case ใดเลย\n\n> ข้อผิดพลาดที่พบบ่อย คือเขียน `if (x = 5)` ซึ่งเป็นการกำหนดค่า ไม่ใช่การเปรียบเทียบ ที่ถูกต้องคือ `if (x == 5)`\n\n### ตัวอย่างงานอาชีพ\nโปรแกรมตรวจสถานะแบตเตอรี่ลิเธียม 1 เซลล์ แบ่งเป็น 4 ระดับตามแรงดัน ใช้แนวคิดเดียวกับวงจรแสดงระดับแบตเตอรี่ในอุปกรณ์จริง","code":[{"name":"battery.c","lang":"c","src":"/* battery.c : ตรวจสถานะแบตเตอรี่ลิเธียม 1 เซลล์จากแรงดันที่วัดได้ (เกณฑ์ตัวอย่างสำหรับฝึกเขียนโปรแกรม) */\n#include \u003cstdio.h>\n\nint main(void)\n{\n    float v;\n    printf(\"Battery voltage (V): \");\n    scanf(\"%f\", &v);\n\n    if (v >= 4.0) {\n        printf(\"Full\\n\");\n    } else if (v >= 3.6) {\n        printf(\"Normal\\n\");\n    } else if (v >= 3.3) {\n        printf(\"Low - please charge\\n\");\n    } else {\n        printf(\"Critical - stop using\\n\");\n    }\n    return 0;\n}"},{"name":"menu.c","lang":"c","src":"/* menu.c : เมนูคำนวณด้วย switch-case */\n#include \u003cstdio.h>\n\nint main(void)\n{\n    int choice;\n    float v, i, r;\n\n    printf(\"1) V = I x R\\n2) I = V / R\\n3) R = V / I\\nSelect: \");\n    scanf(\"%d\", &choice);\n\n    switch (choice) {\n        case 1:\n            printf(\"I R: \");  scanf(\"%f %f\", &i, &r);\n            printf(\"V = %.2f V\\n\", i * r);\n            break;\n        case 2:\n            printf(\"V R: \");  scanf(\"%f %f\", &v, &r);\n            printf(\"I = %.4f A\\n\", v / r);\n            break;\n        case 3:\n            printf(\"V I: \");  scanf(\"%f %f\", &v, &i);\n            printf(\"R = %.2f ohm\\n\", v / i);\n            break;\n        default:\n            printf(\"Invalid choice\\n\");\n    }\n    return 0;\n}"}],"images":[],"url":""},{"id":"pl5","title":"หน่วยที่ 5 คำสั่งทำซ้ำ for, while และ do-while","desc":"เลือกใช้คำสั่งวนซ้ำให้เหมาะกับงาน การนับรอบ และการหยุดวนด้วยค่าพิเศษ","body":"### เลือกใช้คำสั่งวนซ้ำ\n| คำสั่ง | เหมาะกับ | ตรวจเงื่อนไข |\n|---|---|---|\n| for | รู้จำนวนรอบแน่นอน | ก่อนทำ |\n| while | ไม่รู้จำนวนรอบ ทำจนกว่าเงื่อนไขเป็นเท็จ | ก่อนทำ |\n| do-while | ต้องทำอย่างน้อย 1 รอบ เช่น เมนู | หลังทำ |\n\n### ส่วนประกอบของ for\n`for (ค่าเริ่มต้น; เงื่อนไข; การเปลี่ยนค่า)` เช่น `for (v = 0; v \u003c= 12; v++)` วนตั้งแต่ 0 ถึง 12 รวม 13 รอบ\n\n### คำสั่งควบคุมรอบ\n- `break` ออกจากการวนซ้ำทันที\n- `continue` ข้ามคำสั่งที่เหลือในรอบนั้นแล้วไปรอบถัดไป\n\n> ระวังการวนไม่รู้จบ (Infinite loop) เช่น ลืมเปลี่ยนค่าตัวแปรใน while ให้ตรวจว่าเงื่อนไขมีโอกาสเป็นเท็จเสมอ ยกเว้นงานไมโครคอนโทรลเลอร์ที่ตั้งใจให้ loop() ทำงานตลอดเวลา","code":[{"name":"table.c","lang":"c","src":"/* table.c : ตารางกระแสไฟฟ้าเมื่อแรงดันเพิ่มขึ้นทีละ 1 V (R = 220 ohm) */\n#include \u003cstdio.h>\n\nint main(void)\n{\n    const float R = 220.0;\n    int v;\n\n    printf(\"V(V)\\tI(mA)\\n\");\n    for (v = 0; v \u003c= 12; v++) {\n        printf(\"%d\\t%.2f\\n\", v, v / R * 1000);\n    }\n\n    /* while: รับค่าจนกว่าจะกรอก 0 แล้วหาผลรวม */\n    float x, sum = 0;\n    int n = 0;\n    printf(\"Enter readings (0 = stop): \");\n    scanf(\"%f\", &x);\n    while (x != 0) {\n        sum += x;\n        n++;\n        scanf(\"%f\", &x);\n    }\n    if (n > 0) printf(\"Average = %.2f\\n\", sum / n);\n    return 0;\n}"}],"images":[],"url":""},{"id":"pl6","title":"หน่วยที่ 6 อาร์เรย์และสตริง","desc":"เก็บข้อมูลชุดเดียวกันหลายค่าในตัวแปรเดียว และจัดการข้อความ","body":"### อาร์เรย์ (Array)\nอาร์เรย์คือตัวแปรชุดที่เก็บข้อมูลชนิดเดียวกันหลายค่า อ้างถึงแต่ละช่องด้วยลำดับ (Index) ที่เริ่มจาก **0** เช่น `float reading[5];` มีช่อง reading[0] ถึง reading[4]\n\n- ประกาศพร้อมกำหนดค่า: `int seg[10] = {0x3F, 0x06, 0x5B, ...};`\n- ใช้ for วนอ่านหรือเขียนทุกช่อง\n- ห้ามอ้างช่องเกินขนาดอาร์เรย์ เพราะคอมไพเลอร์ภาษาซีไม่ตรวจให้ และอาจทำให้โปรแกรมทำงานผิดพลาด\n\n### สตริง (String)\nภาษาซีเก็บข้อความเป็นอาร์เรย์ของ char ที่ปิดท้ายด้วยอักขระ `\\0` ฟังก์ชันที่ใช้บ่อยอยู่ใน `\u003cstring.h>` เช่น `strlen` (หาความยาว) `strcpy` (คัดลอก) `strcmp` (เปรียบเทียบ)\n\n### ตัวอย่างงานอิเล็กทรอนิกส์\n- ตารางรหัสแถบสีตัวต้านทาน 10 สี เก็บในอาร์เรย์ของสตริง\n- ตารางรหัสแสดงผล 7-Segment เลข 0–9 เก็บในอาร์เรย์จำนวนเต็ม (ใช้จริงในงาน Arduino)\n- เก็บค่าที่อ่านจากเซนเซอร์หลายครั้งแล้วหาค่าเฉลี่ยเพื่อลดสัญญาณรบกวน","code":[{"name":"colorcode.c","lang":"c","src":"/* colorcode.c : แปลงแถบสีตัวต้านทาน 3 แถบเป็นค่าความต้านทาน */\n#include \u003cstdio.h>\n\nint main(void)\n{\n    const char *color[10] = {\"black\", \"brown\", \"red\", \"orange\", \"yellow\",\n                             \"green\", \"blue\", \"violet\", \"grey\", \"white\"};\n    int b1, b2, mul;\n    double value;            /* ใช้ double เพราะค่าอาจเกินขอบเขตของ long บน Windows */\n    int k;\n\n    for (k = 0; k \u003c 10; k++) {\n        printf(\"%d = %s\\n\", k, color[k]);\n    }\n    printf(\"Band 1, Band 2, Multiplier (0-9): \");\n    scanf(\"%d %d %d\", &b1, &b2, &mul);\n\n    value = b1 * 10 + b2;\n    for (k = 0; k \u003c mul; k++) {\n        value *= 10;\n    }\n    printf(\"%s-%s-%s = %.0f ohm\\n\", color[b1], color[b2], color[mul], value);\n    return 0;\n}"}],"images":[],"url":""},{"id":"pl7","title":"หน่วยที่ 7 ฟังก์ชัน","desc":"แบ่งโปรแกรมเป็นส่วนย่อย ส่งค่าพารามิเตอร์ คืนค่า และขอบเขตของตัวแปร","body":"### ทำไมต้องใช้ฟังก์ชัน\nฟังก์ชันช่วยแบ่งโปรแกรมใหญ่เป็นส่วนย่อยที่ทำงานเรื่องเดียว อ่านง่าย ทดสอบง่าย และเรียกใช้ซ้ำได้ เช่น ฟังก์ชันคำนวณความต้านทานรวมเรียกใช้ได้ทุกครั้งที่ต้องการ\n\n### รูปแบบ\n`ชนิดข้อมูลที่คืนค่า ชื่อฟังก์ชัน(พารามิเตอร์) { คำสั่ง; return ค่า; }`\n- ถ้าไม่คืนค่าใช้ `void`\n- ต้องประกาศหรือเขียนฟังก์ชันไว้ก่อน main หรือประกาศต้นแบบ (Prototype) ไว้ด้านบน\n\n### ขอบเขตของตัวแปร\n- **ตัวแปรเฉพาะที่ (Local)** ประกาศในฟังก์ชัน ใช้ได้เฉพาะในฟังก์ชันนั้น\n- **ตัวแปรส่วนกลาง (Global)** ประกาศนอกฟังก์ชัน ทุกฟังก์ชันใช้ได้ ควรใช้เท่าที่จำเป็น\n\n### การส่งค่า\nการส่งค่าแบบปกติเป็นการส่งสำเนา (Pass by value) การแก้ค่าพารามิเตอร์ในฟังก์ชันจะไม่กระทบตัวแปรต้นทาง\n\n> ฟังก์ชัน setup() และ loop() ของ Arduino ก็คือฟังก์ชันภาษาซี/ซีพลัสพลัส ความรู้หน่วยนี้จึงใช้ต่อได้ในวิชาหุ่นยนต์และไมโครคอนโทรลเลอร์","code":[{"name":"functions.c","lang":"c","src":"/* functions.c : แยกงานคำนวณเป็นฟังก์ชัน */\n#include \u003cstdio.h>\n\nfloat series(float r1, float r2)            /* ความต้านทานรวมแบบอนุกรม */\n{\n    return r1 + r2;\n}\n\nfloat parallel(float r1, float r2)          /* ความต้านทานรวมแบบขนาน */\n{\n    return (r1 * r2) / (r1 + r2);\n}\n\nvoid show(const char *label, float value)   /* ฟังก์ชันที่ไม่คืนค่า */\n{\n    printf(\"%-10s = %.2f ohm\\n\", label, value);\n}\n\nint main(void)\n{\n    float r1 = 1000, r2 = 2200;\n    show(\"Series\", series(r1, r2));\n    show(\"Parallel\", parallel(r1, r2));\n    return 0;\n}"}],"images":[],"url":""}]},{"id":"bs2","type":"worksheets","title":"ใบงาน","note":"","items":[{"id":"pw1","title":"ใบงานที่ 1 เขียนผังงานแก้ปัญหา","desc":"วิเคราะห์ปัญหาและเขียนผังงานด้วย Flowgorithm 3 ปัญหา","body":"**จุดประสงค์เชิงพฤติกรรม**\n- วิเคราะห์ข้อมูลเข้า การประมวลผล และผลลัพธ์ของปัญหาได้\n- เขียนผังงานแบบลำดับ เลือกทำ และทำซ้ำได้ถูกต้อง\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์ที่ติดตั้ง Flowgorithm\n- กระดาษสำหรับร่างผังงาน\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. เขียนผังงานคำนวณกำลังไฟฟ้า P = V × I\n2. เขียนผังงานตรวจว่าแรงดันที่วัดได้อยู่ในช่วง 4.75–5.25 V หรือไม่\n3. เขียนผังงานแสดงตัวเลข 1 ถึง 10\n4. ทดสอบรันผังงานใน Flowgorithm ด้วยข้อมูลอย่างน้อย 3 ชุดต่อปัญหา\n\n**บันทึกผลการปฏิบัติงาน**\n| ปัญหา | ข้อมูลเข้า | ผลลัพธ์ที่คาด | ผลลัพธ์จริง |\n|---|---|---|---|\n| P = V × I | | | |\n| ตรวจช่วงแรงดัน | | | |\n| แสดง 1–10 | | | |\n\n**คำถามท้ายใบงาน**\n1. ผังงานแต่ละข้อใช้โครงสร้างควบคุมแบบใด\n2. ถ้าเปลี่ยนให้แสดงเฉพาะเลขคู่ 2–20 ต้องแก้ผังงานส่วนใด","code":[],"images":[],"url":""},{"id":"pw2","title":"ใบงานที่ 2 โปรแกรมรับและแสดงผลข้อมูล","desc":"เขียนโปรแกรมภาษาซีรับข้อมูลและคำนวณตามกฎของโอห์ม","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เขียนโปรแกรมภาษาซีที่มีโครงสร้างถูกต้องได้\n- ประกาศตัวแปรและเลือกชนิดข้อมูลได้เหมาะสม\n- ใช้ printf และ scanf ได้ถูกต้อง\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์ที่ติดตั้ง Dev-C++ หรือ VS Code พร้อมคอมไพเลอร์ GCC\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. พิมพ์และรันโปรแกรม hello.c\n2. พิมพ์โปรแกรม ohm.c แล้วทดสอบด้วยค่าในตาราง\n3. ดัดแปลงโปรแกรมให้รับชื่อผู้ใช้ (สตริง) แล้วแสดงผลพร้อมชื่อ\n4. ดัดแปลงให้แสดงกำลังไฟฟ้า P = V × I เพิ่ม\n\n**บันทึกผลการปฏิบัติงาน**\n| V (V) | R (Ω) | I ที่คำนวณด้วยมือ | I จากโปรแกรม |\n|---|---|---|---|\n| 5 | 220 | | |\n| 12 | 1000 | | |\n| 9 | 470 | | |\n\n**คำถามท้ายใบงาน**\n1. ถ้าลืมใส่ & หน้าตัวแปรใน scanf จะเกิดอะไรขึ้น\n2. ทำไมจึงใช้ float แทน int ในโปรแกรมนี้","code":[],"images":[],"url":""},{"id":"pw3","title":"ใบงานที่ 3 ตัวดำเนินการและสูตรงานอิเล็กทรอนิกส์","desc":"เขียนโปรแกรมคำนวณตัวต้านทานจำกัดกระแส LED และความต้านทานรวม","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เขียนนิพจน์ทางคณิตศาสตร์ตามลำดับความสำคัญได้ถูกต้อง\n- อธิบายผลของการหารจำนวนเต็มได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมคอมไพเลอร์ภาษาซี\n- ตารางค่าแรงดัน Vf ของ LED สีต่าง ๆ\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. รันโปรแกรม led_resistor.c และตรวจผลกับการคำนวณด้วยมือ\n2. แก้ให้รับค่า Vs, Vf และกระแส (mA) จากแป้นพิมพ์\n3. เพิ่มการคำนวณความต้านทานรวมแบบอนุกรม 3 ตัว\n4. ทดลองลบวงเล็บใน (vs - vf) / i แล้วบันทึกผลที่ผิดไป\n\n**บันทึกผลการปฏิบัติงาน**\n| สี LED | Vf (V) | Vs (V) | I (mA) | R ที่ได้ (Ω) |\n|---|---|---|---|---|\n| แดง | 2.0 | 5 | 20 | |\n| เขียว | 2.2 | 5 | 20 | |\n| น้ำเงิน | 3.0 | 5 | 20 | |\n\n**คำถามท้ายใบงาน**\n1. 7 / 2 และ 7.0 / 2 ได้ผลต่างกันอย่างไร เพราะเหตุใด\n2. ถ้าคำนวณได้ R = 150 Ω ควรเลือกใช้ตัวต้านทานค่ามาตรฐานใด","code":[],"images":[],"url":""},{"id":"pw4","title":"ใบงานที่ 4 โปรแกรมตัดสินใจด้วย if และ switch-case","desc":"เขียนโปรแกรมตรวจสถานะแบตเตอรี่และเมนูคำนวณกฎของโอห์ม","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เขียนเงื่อนไขหลายทางด้วย if-else if ได้\n- เขียนเมนูด้วย switch-case และใช้ break ได้ถูกต้อง\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมคอมไพเลอร์ภาษาซี\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. รัน battery.c ด้วยค่า 4.1, 3.7, 3.4 และ 3.0 V\n2. เพิ่มกรณีแรงดันเกิน 4.25 V ให้แจ้ง Overcharge\n3. รัน menu.c ทดสอบทุกเมนู\n4. เพิ่มเมนูที่ 4 คำนวณกำลังไฟฟ้า P = V × I\n5. เพิ่มการตรวจไม่ให้หารด้วยศูนย์\n\n**บันทึกผลการปฏิบัติงาน**\n| ข้อมูลเข้า | ผลที่คาด | ผลจริง |\n|---|---|---|\n| 4.30 V | Overcharge | |\n| 3.70 V | Normal | |\n| เมนู 2, R = 0 | แจ้งเตือน | |\n\n**คำถามท้ายใบงาน**\n1. ถ้าเรียงเงื่อนไข v >= 3.3 ไว้ก่อน v >= 4.0 จะเกิดอะไรขึ้น\n2. ถ้าลืม break ใน case 1 ผลการทำงานจะเป็นอย่างไร","code":[],"images":[],"url":""},{"id":"pw5","title":"ใบงานที่ 5 โปรแกรมวนซ้ำ","desc":"สร้างตารางค่ากระแสไฟฟ้าและหาค่าเฉลี่ยของค่าที่วัดได้","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เลือกใช้ for และ while ได้เหมาะสมกับงาน\n- หยุดการวนซ้ำด้วยค่าพิเศษ (Sentinel) ได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมคอมไพเลอร์ภาษาซี\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. รันโปรแกรม table.c แล้วตรวจค่าที่ 5 V และ 12 V\n2. แก้ให้รับค่า R จากผู้ใช้และกำหนดขั้นแรงดันทีละ 0.5 V\n3. ป้อนค่าที่วัดได้ 5 ค่า แล้วตรวจค่าเฉลี่ยด้วยการคำนวณมือ\n4. เขียนเมนูด้วย do-while ให้ผู้ใช้เลือกคำนวณซ้ำได้จนกว่าจะเลือกออก\n\n**บันทึกผลการปฏิบัติงาน**\n| V (V) | I (mA) จากโปรแกรม | I (mA) คำนวณมือ |\n|---|---|---|\n| 5 | | |\n| 12 | | |\n\n**คำถามท้ายใบงาน**\n1. for (v = 0; v \u003c= 12; v++) วนกี่รอบ\n2. ยกตัวอย่างงานที่ควรใช้ do-while มากกว่า while","code":[],"images":[],"url":""},{"id":"pw6","title":"ใบงานที่ 6 อาร์เรย์และสตริง","desc":"เขียนโปรแกรมแปลงแถบสีตัวต้านทานและหาค่าเฉลี่ยจากอาร์เรย์","body":"**จุดประสงค์เชิงพฤติกรรม**\n- ประกาศและใช้งานอาร์เรย์ร่วมกับคำสั่งวนซ้ำได้\n- ใช้อาร์เรย์ของสตริงเก็บข้อมูลแบบตารางได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมคอมไพเลอร์ภาษาซี\n- ตัวต้านทานจริง 3 ตัวสำหรับอ่านแถบสี\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. รัน colorcode.c แล้วป้อนรหัสสีของตัวต้านทานจริง 3 ตัว\n2. วัดค่าจริงด้วยมัลติมิเตอร์แล้วเปรียบเทียบ\n3. เขียนโปรแกรมเก็บค่าที่อ่านได้ 10 ค่าในอาร์เรย์ หาค่าสูงสุด ต่ำสุด และค่าเฉลี่ย\n4. เพิ่มการตรวจไม่ให้ป้อนรหัสนอกช่วง 0–9\n\n**บันทึกผลการปฏิบัติงาน**\n| แถบสี | ค่าจากโปรแกรม (Ω) | ค่าที่วัดได้ (Ω) | คลาดเคลื่อน (%) |\n|---|---|---|---|\n| | | | |\n| | | | |\n| | | | |\n\n**คำถามท้ายใบงาน**\n1. index ของอาร์เรย์ขนาด 10 ช่องมีค่าตั้งแต่เท่าใดถึงเท่าใด\n2. ถ้าป้อนรหัสสี 12 โปรแกรมเดิมจะเกิดปัญหาอะไร","code":[],"images":[],"url":""},{"id":"pw7","title":"ใบงานที่ 7 โปรแกรมคำนวณวงจรด้วยฟังก์ชัน","desc":"แยกสูตรคำนวณเป็นฟังก์ชันและรวมเป็นโปรแกรมเครื่องคิดเลขงานไฟฟ้า","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เขียนฟังก์ชันที่รับพารามิเตอร์และคืนค่าได้\n- เรียกใช้ฟังก์ชันซ้ำในโปรแกรมได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมคอมไพเลอร์ภาษาซี\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. รัน functions.c และตรวจผลความต้านทานอนุกรมและขนาน\n2. เพิ่มฟังก์ชัน power(v, i) และ led_resistor(vs, vf, i_mA)\n3. สร้างเมนู do-while เรียกใช้ทุกฟังก์ชัน\n4. ทดสอบด้วยข้อมูลอย่างน้อย 3 ชุดต่อฟังก์ชันและบันทึกผล\n\n**บันทึกผลการปฏิบัติงาน**\n| ฟังก์ชัน | ข้อมูลเข้า | ผลที่คาด | ผลจริง |\n|---|---|---|---|\n| series | 1000, 2200 | 3200 | |\n| parallel | 1000, 2200 | 687.5 | |\n| power | | | |\n\n**คำถามท้ายใบงาน**\n1. ตัวแปร r1 ในฟังก์ชัน series กับตัวแปร r1 ใน main เป็นตัวเดียวกันหรือไม่\n2. ข้อดีของการแยกสูตรเป็นฟังก์ชันคืออะไร","code":[],"images":[],"url":""}]},{"id":"bs3","type":"gallery","title":"รูปเพิ่มเติม","note":"","items":[{"id":"pg1","title":"ฝึกปฏิบัติงานในห้องปฏิบัติการอิเล็กทรอนิกส์","desc":"","url":"img/electronics-lab.jpg"},{"id":"pg2","title":"บรรยากาศการเรียนในห้องเรียน","desc":"","url":"img/class-1.jpg"}]}],"refs":[{"title":"รายวิชา 04621101 Computer Programming (ภาษาซี, Flowgorithm) – มหาวิทยาลัยเทคโนโลยีราชมงคลธัญบุรี","url":"https://www.compro.rmutt.ac.th/wp-content/uploads/2023/07/CH0_Intro.pdf"},{"title":"240-101 Introduction to Computer Programming (ภาษาซี) – ภาควิชาวิศวกรรมคอมพิวเตอร์ ม.สงขลานครินทร์ วิทยาเขตภูเก็ต","url":"https://x.coe.phuket.psu.ac.th/warodom/240-101/introcom-syllabus-1-61.pdf"},{"title":"CS50x Week 1: C – Harvard University","url":"https://cs50.harvard.edu/x/2022/weeks/1"}]},{"id":"c20105-2010","code":"20105-2010","name":"หุ่นยนต์เบื้องต้น","t":1,"p":3,"n":2,"h":8,"slots":[{"d":1,"s":"08:00","e":"12:00","room":"11202","group":"พท.2/2"},{"d":2,"s":"08:00","e":"12:00","room":"8407","group":"ชอ.3/1"}],"sections":[{"id":"cs1","type":"lessons","title":"เนื้อหา","note":"","items":[{"id":"rl1","title":"การขับมอเตอร์ DC ด้วยวงจร H-Bridge และโมดูล L298N","desc":"หลักการกลับทิศทางมอเตอร์ การต่อวงจร L298N กับ Arduino UNO และการปรับความเร็วด้วย PWM","body":"### หลักการของวงจร H-Bridge\nมอเตอร์ไฟฟ้ากระแสตรง (DC Motor) จะหมุนกลับทิศทางได้เมื่อกลับขั้วแรงดันที่ป้อนให้ วงจร H-Bridge ใช้สวิตช์อิเล็กทรอนิกส์ 4 ตัว (ทรานซิสเตอร์หรือ MOSFET) จัดวางเป็นรูปตัว H โดยมีมอเตอร์อยู่ตรงกลาง เมื่อเปิดสวิตช์คู่ทแยงคู่หนึ่ง กระแสจะไหลผ่านมอเตอร์ทิศทางหนึ่ง เมื่อสลับไปเปิดอีกคู่หนึ่ง กระแสจะไหลกลับทิศ มอเตอร์จึงหมุนกลับด้าน\n\n> ห้ามเปิดสวิตช์ด้านบนและด้านล่างของขาเดียวกันพร้อมกัน เพราะจะเกิดการลัดวงจรแหล่งจ่าย (shoot-through) ทำให้อุปกรณ์เสียหาย\n\n### โมดูล L298N\n- มี H-Bridge 2 ชุดในตัว จึงขับมอเตอร์ได้ 2 ตัว (ช่อง A และช่อง B)\n- ขา **IN1, IN2** กำหนดทิศทางของมอเตอร์ช่อง A ส่วนขา **ENA** ใช้เปิด-ปิด หรือรับสัญญาณ PWM เพื่อปรับความเร็ว\n- ใช้แหล่งจ่ายสำหรับมอเตอร์แยกจากบอร์ด เช่น แบตเตอรี่ 7.4–12 V และต้อง **ต่อ GND ร่วมกับ Arduino** เสมอ\n- ไอซี L298 ใช้ทรานซิสเตอร์ไบโพลาร์ จึงมีแรงดันตกคร่อมภายในประมาณ 2–3 V (ขึ้นกับกระแส) มอเตอร์จะได้แรงดันต่ำกว่าแบตเตอรี่\n\n### ตารางการทำงาน\n| IN1 | IN2 | ENA | ผลที่ได้ |\n|---|---|---|---|\n| HIGH | LOW | HIGH | หมุนขวา |\n| LOW | HIGH | HIGH | หมุนซ้าย |\n| LOW | LOW | LOW | หยุด |\n\n### การปรับความเร็วด้วย PWM\nคำสั่ง `analogWrite(ENA, ค่า)` ส่งสัญญาณ PWM ค่า 0–255 ค่ายิ่งมาก มอเตอร์ยิ่งได้รับพลังงานเฉลี่ยมากและหมุนเร็วขึ้น ขาที่ใช้ต้องเป็นขา PWM (บน UNO คือขา 3, 5, 6, 9, 10, 11)","code":[{"name":"L298N_Switch.ino","lang":"cpp","src":"// ขับมอเตอร์ DC ด้วย L298N\n// กด SW1 = หมุนขวา, กด SW2 = หมุนซ้าย, ไม่กด = หยุด\n#define SW1 5\n#define SW2 6\n#define IN1 8\n#define IN2 9\n#define ENA 10\n\nvoid setup() {\n  pinMode(IN1, OUTPUT);\n  pinMode(IN2, OUTPUT);\n  pinMode(ENA, OUTPUT);\n  pinMode(SW1, INPUT_PULLUP);   // ใช้ตัวต้านทานพูลอัปในชิป: กดสวิตช์ = LOW\n  pinMode(SW2, INPUT_PULLUP);\n}\n\nvoid loop() {\n  bool s1 = (digitalRead(SW1) == LOW);\n  bool s2 = (digitalRead(SW2) == LOW);\n\n  if (s1 && !s2) {            // หมุนขวา\n    digitalWrite(IN1, HIGH);\n    digitalWrite(IN2, LOW);\n    digitalWrite(ENA, HIGH);\n  } else if (s2 && !s1) {     // หมุนซ้าย\n    digitalWrite(IN1, LOW);\n    digitalWrite(IN2, HIGH);\n    digitalWrite(ENA, HIGH);\n  } else {                    // หยุด\n    digitalWrite(IN1, LOW);\n    digitalWrite(IN2, LOW);\n    digitalWrite(ENA, LOW);\n  }\n  delay(50);\n}"},{"name":"L298N_Speed.ino","lang":"cpp","src":"// ปรับความเร็วมอเตอร์ด้วย PWM ที่ขา ENA (D10 เป็นขา PWM ของ UNO)\n#define IN1 8\n#define IN2 9\n#define ENA 10\n\nvoid setup() {\n  pinMode(IN1, OUTPUT);\n  pinMode(IN2, OUTPUT);\n  pinMode(ENA, OUTPUT);\n  digitalWrite(IN1, HIGH);    // กำหนดทิศทางหมุนขวา\n  digitalWrite(IN2, LOW);\n}\n\nvoid loop() {\n  for (int speed = 80; speed \u003c= 255; speed += 25) {   // ค่อย ๆ เร่ง\n    analogWrite(ENA, speed);\n    delay(400);\n  }\n  analogWrite(ENA, 0);        // หยุดพัก 1 วินาที\n  delay(1000);\n}"}],"images":[{"url":"svg/robot-l298n.svg","cap":"ภาพที่ 1 การต่อวงจรขับมอเตอร์ DC ด้วย L298N (วาดใหม่สำหรับเว็บไซต์นี้)"}],"url":""},{"id":"rl2","title":"การควบคุมเซอร์โวมอเตอร์ด้วยสัญญาณ PWM","desc":"โครงสร้างเซอร์โว ความสัมพันธ์ระหว่างความกว้างพัลส์กับมุม และการเขียนโปรแกรม 2 แบบ","body":"### เซอร์โวมอเตอร์คืออะไร\nเซอร์โวมอเตอร์ (Servo Motor) เป็นมอเตอร์ที่หมุนไปยังมุมที่สั่งแล้วหยุดค้างไว้ ภายในประกอบด้วยมอเตอร์ DC ชุดเฟืองทด ตัวต้านทานปรับค่าได้สำหรับวัดมุม และวงจรควบคุมแบบป้อนกลับ จึงนิยมใช้เป็นข้อต่อแขนกล มือจับ หรือกลไกเลี้ยวของหุ่นยนต์\n\n### สัญญาณควบคุม\n- ส่งพัลส์ซ้ำทุก ๆ ประมาณ **20 ms** (50 Hz)\n- ความกว้างพัลส์เป็นตัวกำหนดมุม เช่น ประมาณ 0.5 ms = 0°, 1.5 ms = 90° (กึ่งกลาง), 2.5 ms = 180°\n- ค่าจริงต่างกันไปตามรุ่น บางรุ่นใช้ช่วง 1.0–2.0 ms ควรทดสอบทีละน้อยเพื่อไม่ให้เฟืองหมุนชนจนค้าง\n\n### การต่อสาย (รุ่น SG90)\n- สายน้ำตาล = GND, สายแดง = +5 V, สายส้ม = สัญญาณ (ต่อขา D9)\n- ถ้าใช้เซอร์โวหลายตัว ให้ใช้แหล่งจ่าย 5 V แยก แล้วต่อ GND ร่วมกับบอร์ด เพื่อไม่ให้บอร์ดรีเซ็ตเพราะกระแสไม่พอ\n\n### เขียนโปรแกรมได้ 2 วิธี\n1. สร้างพัลส์เองด้วย `digitalWrite` และ `delayMicroseconds` ช่วยให้เห็นหลักการของสัญญาณชัดเจน\n2. ใช้ไลบรารี `Servo.h` สั่งเป็นองศาด้วย `write(มุม)` โค้ดสั้นและแม่นยำกว่า เหมาะกับงานจริง\n\n> บนบอร์ด UNO เมื่อใช้ไลบรารี Servo จะใช้ `analogWrite()` ที่ขา 9 และ 10 ไม่ได้ ถ้าหุ่นยนต์ใช้ทั้งเซอร์โวและ L298N ให้ย้ายขา ENA ไปขา PWM อื่น เช่น ขา 5 หรือ 6","code":[{"name":"Servo_Switch.ino","lang":"cpp","src":"// สร้างพัลส์ควบคุมเซอร์โวเอง: กด SW1 = 0°, SW2 = 90°, SW3 = 180°\n#define SERVO 9\n#define SW1 7\n#define SW2 6\n#define SW3 5\nint pulse = 1500;             // ความกว้างพัลส์ หน่วยไมโครวินาที\n\nvoid setup() {\n  pinMode(SERVO, OUTPUT);\n  pinMode(SW1, INPUT_PULLUP);\n  pinMode(SW2, INPUT_PULLUP);\n  pinMode(SW3, INPUT_PULLUP);\n}\n\nvoid loop() {\n  if (digitalRead(SW1) == LOW)      pulse = 500;\n  else if (digitalRead(SW2) == LOW) pulse = 1500;\n  else if (digitalRead(SW3) == LOW) pulse = 2500;\n\n  digitalWrite(SERVO, HIGH);   // ส่งพัลส์ซ้ำทุก ๆ ประมาณ 20 ms\n  delayMicroseconds(pulse);\n  digitalWrite(SERVO, LOW);\n  delay(20);\n}"},{"name":"Servo_Sweep.ino","lang":"cpp","src":"// ใช้ไลบรารี Servo ที่มากับ Arduino IDE\n#include \u003cServo.h>\n\nServo arm;\n\nvoid setup() {\n  arm.attach(9, 500, 2500);   // ขา, พัลส์ต่ำสุด, พัลส์สูงสุด (ไมโครวินาที)\n}\n\nvoid loop() {\n  for (int angle = 0; angle \u003c= 180; angle += 10) {\n    arm.write(angle);\n    delay(150);\n  }\n  for (int angle = 180; angle >= 0; angle -= 10) {\n    arm.write(angle);\n    delay(150);\n  }\n}"}],"images":[{"url":"svg/robot-servo.svg","cap":"ภาพที่ 2 สัญญาณ PWM กับมุมของเซอร์โว และการต่อสาย SG90 (วาดใหม่)"}],"url":""},{"id":"rl3","title":"หุ่นยนต์ควบคุมผ่าน Bluetooth ด้วยแอปบนโทรศัพท์","desc":"ระบบสื่อสารระหว่างแอป โมดูล HC-05 และ Arduino เพื่อบังคับหุ่นยนต์ 2 ล้อ","body":"### ภาพรวมของระบบ\nแอปบนโทรศัพท์ส่ง **ตัวอักษรคำสั่ง** ผ่าน Bluetooth ไปยังโมดูล HC-05 โมดูลจะส่งต่อข้อมูลเข้าขา RX ของ Arduino ผ่านการสื่อสารแบบอนุกรม (Serial) จากนั้นโปรแกรมอ่านคำสั่งแล้วสั่งโมดูล L298N ให้ขับล้อซ้ายและล้อขวา\n\n| คำสั่ง | การทำงาน |\n|---|---|\n| F | เดินหน้า |\n| B | ถอยหลัง |\n| L | เลี้ยวซ้าย |\n| R | เลี้ยวขวา |\n| S | หยุด |\n\n### การต่อโมดูล HC-05\n- VCC → 5 V, GND → GND\n- TX ของ HC-05 → RX (D0) ของ Arduino\n- RX ของ HC-05 รับระดับสัญญาณ 3.3 V จึงควรต่อผ่านวงจรแบ่งแรงดัน (เช่น ตัวต้านทาน 1 kΩ และ 2 kΩ) จากขา TX (D1)\n- ความเร็วสื่อสารเริ่มต้นในโหมดรับส่งข้อมูลคือ 9600 bps และรหัสจับคู่เริ่มต้นมักเป็น 1234 หรือ 0000\n\n> ขา D0/D1 ใช้ร่วมกับพอร์ต USB ต้องถอดสายจาก HC-05 ออกก่อนอัปโหลดโค้ดทุกครั้ง หรือย้ายไปใช้ไลบรารี SoftwareSerial กับขาอื่น\n\n### การสร้างแอปด้วย MIT App Inventor\n1. ใช้ ListPicker แสดงรายชื่ออุปกรณ์ Bluetooth ที่จับคู่ไว้ แล้วเชื่อมต่อด้วย BluetoothClient\n2. สร้างปุ่ม 5 ปุ่ม แต่ละปุ่มเรียก `BluetoothClient.SendText` ส่งตัวอักษร F, B, L, R, S\n3. ทดสอบส่งคำสั่งทีละปุ่มขณะยกล้อหุ่นยนต์ขึ้นจากพื้น ถ้าล้อหมุนผิดทิศหรือเลี้ยวสลับด้าน ให้สลับสายมอเตอร์ที่ขา OUT ของ L298N","code":[{"name":"Robot_Bluetooth.ino","lang":"cpp","src":"// หุ่นยนต์ 2 ล้อ ควบคุมด้วยแอปผ่านโมดูล HC-05 (Serial 9600)\n#define IN1 13\n#define IN2 12\n#define IN3 11\n#define IN4 10\nchar state = 'S';\n\nvoid drive(int a, int b, int c, int d) {\n  digitalWrite(IN1, a);  digitalWrite(IN2, b);\n  digitalWrite(IN3, c);  digitalWrite(IN4, d);\n}\n\nvoid setup() {\n  pinMode(IN1, OUTPUT);  pinMode(IN2, OUTPUT);\n  pinMode(IN3, OUTPUT);  pinMode(IN4, OUTPUT);\n  Serial.begin(9600);          // ความเร็วเริ่มต้นของ HC-05\n}\n\nvoid loop() {\n  if (Serial.available() > 0) {\n    state = Serial.read();     // อ่านตัวอักษรคำสั่งจากแอป\n  }\n  switch (state) {\n    case 'F': drive(LOW, HIGH, HIGH, LOW); break;   // เดินหน้า\n    case 'B': drive(HIGH, LOW, LOW, HIGH); break;   // ถอยหลัง\n    case 'L': drive(LOW, LOW, HIGH, LOW);  break;   // เลี้ยวซ้าย\n    case 'R': drive(LOW, HIGH, LOW, LOW);  break;   // เลี้ยวขวา\n    default:  drive(LOW, LOW, LOW, LOW);   break;   // S หรือคำสั่งอื่น = หยุด\n  }\n  delay(20);\n}"}],"images":[{"url":"svg/robot-bluetooth.svg","cap":"ภาพที่ 3 แผนผังระบบหุ่นยนต์ควบคุมผ่าน Bluetooth (วาดใหม่)"}],"url":""}]},{"id":"cs2","type":"worksheets","title":"ใบงาน","note":"","items":[{"id":"rw1","title":"ใบงานที่ 1 ขับมอเตอร์ DC กลับทิศทางด้วย L298N","desc":"ต่อวงจรและเขียนโปรแกรมให้มอเตอร์หมุนซ้าย หมุนขวา และหยุดตามสวิตช์","body":"**จุดประสงค์เชิงพฤติกรรม**\n- ต่อวงจรขับมอเตอร์ DC ด้วยโมดูล L298N ได้ถูกต้อง\n- เขียนโปรแกรมควบคุมทิศทางการหมุนของมอเตอร์ได้\n- ปรับความเร็วมอเตอร์ด้วยสัญญาณ PWM ได้\n\n**เครื่องมือและอุปกรณ์**\n- บอร์ด Arduino UNO และสาย USB\n- โมดูล L298N 1 ตัว\n- มอเตอร์ DC 3–6 V พร้อมล้อ 1 ชุด\n- สวิตช์กดติดปล่อยดับ 2 ตัว\n- แบตเตอรี่ 7.4 V พร้อมกะบะ\n- สายจัมเปอร์ และมัลติมิเตอร์\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. ศึกษาภาพที่ 1 แล้วต่อวงจรโดยยังไม่ต่อแบตเตอรี่\n2. ตรวจสอบการต่อ GND ร่วมระหว่างบอร์ดกับ L298N\n3. อัปโหลดโปรแกรม L298N_Switch.ino\n4. ต่อแบตเตอรี่ แล้วกด SW1 และ SW2 สังเกตทิศทางการหมุน\n5. วัดแรงดันที่ขา OUT1–OUT2 ขณะมอเตอร์หมุน แล้วบันทึกผล\n6. อัปโหลด L298N_Speed.ino แล้วสังเกตความเร็วที่เปลี่ยนไป\n\n**บันทึกผลการปฏิบัติงาน**\n| สวิตช์ที่กด | IN1 | IN2 | ENA | ทิศทางที่สังเกตได้ | แรงดัน OUT (V) |\n|---|---|---|---|---|---|\n| SW1 | | | | | |\n| SW2 | | | | | |\n| ไม่กด | | | | | |\n\n**คำถามท้ายใบงาน**\n1. เหตุใดต้องต่อ GND ของแบตเตอรี่ร่วมกับ GND ของ Arduino\n2. แรงดันที่วัดได้ที่ OUT ต่ำกว่าแรงดันแบตเตอรี่เท่าใด เพราะอะไร\n3. ถ้าต้องการให้มอเตอร์หมุนช้าลงครึ่งหนึ่ง ควรส่งค่า analogWrite เท่าใดโดยประมาณ","code":[],"images":[],"url":""},{"id":"rw2","title":"ใบงานที่ 2 ควบคุมมุมเซอร์โวมอเตอร์ด้วยสวิตช์","desc":"สร้างพัลส์ควบคุมเอง และใช้ไลบรารี Servo สั่งมุม 0°–180°","body":"**จุดประสงค์เชิงพฤติกรรม**\n- อธิบายความสัมพันธ์ระหว่างความกว้างพัลส์กับมุมของเซอร์โวได้\n- เขียนโปรแกรมสั่งเซอร์โวไปยังมุมที่กำหนดได้ 2 วิธี\n\n**เครื่องมือและอุปกรณ์**\n- บอร์ด Arduino UNO\n- เซอร์โวมอเตอร์ SG90\n- สวิตช์กดติดปล่อยดับ 3 ตัว\n- ไม้โปรแทรกเตอร์ (ไม้วัดมุม)\n- สายจัมเปอร์\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. ต่อสายเซอร์โวตามภาพที่ 2 และต่อสวิตช์เข้าขา D7, D6, D5\n2. อัปโหลด Servo_Switch.ino แล้วกดสวิตช์ทีละตัว\n3. วัดมุมจริงด้วยไม้โปรแทรกเตอร์และบันทึกผล\n4. ปรับค่า pulse ทีละ 100 µs เพื่อหาค่าที่ได้มุม 0° และ 180° พอดี\n5. อัปโหลด Servo_Sweep.ino แล้วสังเกตการกวาดมุม\n\n**บันทึกผลการปฏิบัติงาน**\n| ความกว้างพัลส์ (µs) | มุมที่ต้องการ | มุมที่วัดได้ | คลาดเคลื่อน (องศา) |\n|---|---|---|---|\n| 500 | 0° | | |\n| 1500 | 90° | | |\n| 2500 | 180° | | |\n\n**คำถามท้ายใบงาน**\n1. ถ้าส่งพัลส์ห่างกันนานเกินไป เช่น ทุก 200 ms จะเกิดอะไรขึ้นกับเซอร์โว\n2. ข้อดีของการใช้ไลบรารี Servo เมื่อเทียบกับการสร้างพัลส์เองคืออะไร\n3. เมื่อใช้เซอร์โว 4 ตัวพร้อมกัน ควรจัดแหล่งจ่ายไฟอย่างไร","code":[],"images":[],"url":""},{"id":"rw3","title":"ใบงานที่ 3 สร้างหุ่นยนต์ควบคุมผ่าน Bluetooth","desc":"ประกอบหุ่นยนต์ 2 ล้อ สร้างแอป และบังคับหุ่นยนต์ให้เคลื่อนที่ตามเส้นทางที่กำหนด","body":"**จุดประสงค์เชิงพฤติกรรม**\n- ต่อโมดูล HC-05 กับ Arduino ได้ถูกต้องและปลอดภัย\n- สร้างแอปควบคุมด้วย MIT App Inventor ได้\n- บังคับหุ่นยนต์เคลื่อนที่ตามเส้นทางทดสอบได้\n\n**เครื่องมือและอุปกรณ์**\n- โครงรถหุ่นยนต์ 2 ล้อพร้อมมอเตอร์\n- Arduino UNO และโมดูล L298N\n- โมดูล Bluetooth HC-05\n- ตัวต้านทาน 1 kΩ และ 2 kΩ อย่างละ 1 ตัว\n- โทรศัพท์ Android และบัญชี MIT App Inventor\n- แบตเตอรี่ 7.4 V\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. ประกอบโครงรถและต่อวงจรตามภาพที่ 3\n2. ถอดสาย HC-05 ออกจาก D0 แล้วอัปโหลด Robot_Bluetooth.ino\n3. ต่อสาย HC-05 กลับ จับคู่โทรศัพท์กับโมดูล\n4. สร้างแอปที่มีปุ่ม F, B, L, R, S แล้วติดตั้งลงโทรศัพท์\n5. ยกล้อขึ้นจากพื้นแล้วทดสอบทีละคำสั่ง\n6. บังคับหุ่นยนต์ผ่านเส้นทางรูปตัว S แล้วจับเวลา\n\n**บันทึกผลการปฏิบัติงาน**\n| คำสั่ง | ล้อซ้าย | ล้อขวา | ผลที่ได้ถูกต้องหรือไม่ |\n|---|---|---|---|\n| F | | | |\n| B | | | |\n| L | | | |\n| R | | | |\n| S | | | |\n\n**คำถามท้ายใบงาน**\n1. เหตุใดต้องต่อวงจรแบ่งแรงดันที่ขา RX ของ HC-05\n2. ถ้าต้องการเพิ่มคำสั่งเปิดไฟหน้า ต้องแก้ทั้งแอปและโค้ดอย่างไร\n3. เสนอวิธีป้องกันไม่ให้หุ่นยนต์วิ่งต่อเมื่อสัญญาณ Bluetooth หลุด","code":[],"images":[],"url":""}]},{"id":"cs3","type":"gallery","title":"รูปเพิ่มเติม","note":"","items":[{"id":"rg1","title":"นักเรียนทดสอบรถหุ่นยนต์ที่ประกอบและเขียนโปรแกรมเอง","desc":"","url":"img/robot-cars.jpg"},{"id":"rg2","title":"กิจกรรมแสดงผลงานรถหุ่นยนต์ของนักเรียน","desc":"","url":"img/robot-lab.jpg"},{"id":"rg3","title":"จำลองวงจร Arduino ด้วยโปรแกรม Proteus ก่อนต่อวงจรจริง","desc":"","url":"img/proteus-sim.jpg"}]}],"refs":[{"title":"Arduino Language Reference (analogWrite, Servo)","url":"https://docs.arduino.cc/language-reference/"}]},{"id":"c21906-2011","code":"21906-2011","name":"การประยุกต์ใช้เทคโนโลยีปัญญาประดิษฐ์ในงานอาชีพ","t":1,"p":2,"n":2,"h":9,"slots":[{"d":2,"s":"14:00","e":"17:00","room":"Com1","group":"ชก.3/2"},{"d":4,"s":"10:00","e":"12:00","room":"8407","group":"ชฟ.3/2"},{"d":4,"s":"13:00","e":"14:00","room":"8407","group":"ชฟ.3/2"},{"d":5,"s":"14:00","e":"17:00","room":"ห้องปฏิบัติคอม 2","group":"ชอ.2/1"}],"sections":[{"id":"ds1","type":"lessons","title":"เนื้อหา","note":"","items":[{"id":"al1","title":"เตรียมเครื่องมือ: Python, Virtual Environment และ YOLO","desc":"รู้จักโมเดลตรวจจับวัตถุ YOLO ติดตั้งเครื่องมือบน Windows และทดสอบโมเดลกับภาพนิ่ง","body":"### YOLO คืออะไร\nYOLO (You Only Look Once) เป็นโมเดลการเรียนรู้เชิงลึกสำหรับ **ตรวจจับวัตถุ (Object Detection)** ที่มองภาพเพียงครั้งเดียวแล้วบอกผลพร้อมกัน 3 อย่าง คือ ตำแหน่งกรอบของวัตถุ (Bounding Box) ชื่อคลาส และค่าความมั่นใจ (Confidence) จึงทำงานได้เร็วพอสำหรับวิดีโอสด ในรายวิชานี้ใช้ไลบรารี **Ultralytics** ซึ่งมีโมเดลที่ฝึกมาแล้วกับชุดข้อมูล COCO จำนวน 80 คลาส\n\n| ขนาดโมเดล | ลักษณะ |\n|---|---|\n| n (nano) | เล็กและเร็วที่สุด เหมาะกับคอมพิวเตอร์ทั่วไปและงานเรียลไทม์ |\n| s, m | สมดุลระหว่างความเร็วและความแม่นยำ |\n| l, x | แม่นยำที่สุด แต่ต้องใช้การ์ดจอ |\n\n### ขั้นตอนเตรียมเครื่องมือ\n1. ติดตั้ง Python 3.10 และเลือก Add python.exe to PATH\n2. สร้างโฟลเดอร์งาน แล้วสร้าง **Virtual Environment** เพื่อแยกไลบรารีของแต่ละงานไม่ให้ปนกัน\n3. ติดตั้ง `ultralytics` (OpenCV จะติดตั้งมาพร้อมกัน) และ `pyserial` สำหรับสื่อสารกับบอร์ด\n4. ใช้ VS Code หรือ Thonny เปิดโฟลเดอร์ แล้วรัน `detect.py` เพื่อทดสอบ\n\n> เมื่อเปิดใช้ Virtual Environment สำเร็จ จะเห็นคำว่า (venv) นำหน้าบรรทัดคำสั่ง ถ้าไม่เห็นแปลว่ายังติดตั้งไลบรารีลงในเครื่องหลักอยู่\n\n### ฝึกโมเดลด้วยข้อมูลของตนเอง\nถ้าต้องการให้โมเดลรู้จักวัตถุใหม่ เช่น ชิ้นงานอิเล็กทรอนิกส์ ให้ถ่ายภาพตัวอย่าง ติดฉลากข้อมูล (Data Labeling) บนเว็บไซต์ Roboflow แล้วส่งออกเป็นรูปแบบ YOLO จะได้ไฟล์ `data.yaml` พร้อมโฟลเดอร์ภาพ จากนั้นรัน `train.py`","code":[{"name":"setup.bat","lang":"bat","src":":: 1) สร้างโฟลเดอร์งาน แล้วเข้าไปในโฟลเดอร์\nd:\nmkdir YOLOV8\ncd YOLOV8\n\n:: 2) สร้างและเปิดใช้ Virtual Environment\npython -m venv venv\nvenv\\scripts\\activate.bat\n\n:: 3) ติดตั้งไลบรารี (OpenCV ติดตั้งมาพร้อม ultralytics)\npip install ultralytics\npip install pyserial\n\n:: ออกจาก Virtual Environment เมื่อเลิกใช้งาน\ndeactivate"},{"name":"detect.py","lang":"python","src":"# detect.py : ทดสอบว่า YOLO ติดตั้งสำเร็จ\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolov8n.pt\")       # ครั้งแรกจะดาวน์โหลดไฟล์โมเดลให้อัตโนมัติ\nresults = model(\"bird.jpg\")      # เปลี่ยนเป็นชื่อไฟล์ภาพของตนเอง\nresults[0].show()                # แสดงภาพพร้อมกรอบวัตถุที่ตรวจพบ"},{"name":"train.py","lang":"python","src":"# train.py : ฝึกโมเดลด้วยชุดข้อมูลของตนเอง (ไฟล์ data.yaml ได้จาก Roboflow)\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolov8n.pt\")\nresults = model.train(\n    data=\"data.yaml\",\n    epochs=50,\n    imgsz=800,\n    device=\"cpu\",     # ถ้ามีการ์ดจอ NVIDIA ใช้ device=0\n    workers=0\n)\nmetrics = model.val()  # ประเมินความแม่นยำกับชุดข้อมูลตรวจสอบ"}],"images":[{"url":"svg/ai-yolo-flow.svg","cap":"ภาพที่ 1 ขั้นตอนเตรียมเครื่องมือ YOLO บน Windows (วาดใหม่)"}],"url":""},{"id":"al2","title":"ตรวจจับวัตถุแบบเรียลไทม์ด้วยกล้องเว็บแคม","desc":"อ่านภาพจากกล้องทีละเฟรม ส่งให้ YOLO ประมวลผล และแสดงกรอบวัตถุบนหน้าจอ","body":"### ลำดับการทำงานของโปรแกรม\n1. เปิดกล้องด้วย `cv2.VideoCapture(0)`\n2. อ่านภาพทีละเฟรมด้วย `cap.read()`\n3. ส่งเฟรมให้โมเดล `model(frame, conf=0.5)` โดยกำหนดค่าความมั่นใจขั้นต่ำ 0.5\n4. วาดผลลัพธ์ด้วย `results[0].plot()` แล้วแสดงด้วย `cv2.imshow`\n5. วนซ้ำจนกว่าจะกดปุ่ม q แล้วคืนกล้องด้วย `cap.release()`\n\n### ค่าความมั่นใจ (Confidence)\nค่า `conf` อยู่ระหว่าง 0–1 ถ้าตั้งต่ำ จะตรวจพบวัตถุมากขึ้นแต่ผิดพลาดบ่อย ถ้าตั้งสูง ผลแม่นยำขึ้นแต่อาจพลาดวัตถุที่เห็นไม่ชัด งานควบคุมอุปกรณ์จริงควรเริ่มที่ 0.5 แล้วปรับตามการทดลอง\n\n### คลาสที่โมเดลรู้จัก\nโมเดล `yolo11n.pt` รู้จัก 80 คลาส ดูรายชื่อได้จาก `model.names` ตัวอย่างคลาสที่ใช้บ่อยในงานอาชีพ\n\n| ID | ชื่อคลาส | ความหมาย |\n|---|---|---|\n| 0 | person | คน |\n| 39 | bottle | ขวด |\n| 63 | laptop | แล็ปท็อป |\n| 67 | cell phone | โทรศัพท์มือถือ |\n| 76 | scissors | กรรไกร |","code":[{"name":"main.py","lang":"python","src":"# main.py : ตรวจจับวัตถุแบบเรียลไทม์จากเว็บแคม\nimport cv2\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolo11n.pt\")       # รุ่น nano เร็วพอสำหรับวิดีโอสด\ncap = cv2.VideoCapture(0)        # 0 = กล้องหลักของเครื่อง\n\nif not cap.isOpened():\n    print(\"เปิดกล้องไม่ได้\")\n    exit()\n\nprint(\"กด q เพื่อออกจากโปรแกรม\")\nwhile True:\n    ret, frame = cap.read()\n    if not ret:\n        break\n\n    results = model(frame, conf=0.5, verbose=False)   # รับเฉพาะผลที่มั่นใจ ≥ 50%\n    annotated = results[0].plot()                     # วาดกรอบ ชื่อคลาส และค่าความมั่นใจ\n    cv2.imshow(\"YOLO Real-Time Detection\", annotated)\n\n    if cv2.waitKey(1) & 0xFF == ord('q'):\n        break\n\ncap.release()\ncv2.destroyAllWindows()"},{"name":"classes.py","lang":"python","src":"# classes.py : ดูรายชื่อคลาสที่โมเดลรู้จัก\nfrom ultralytics import YOLO\n\nmodel = YOLO(\"yolo11n.pt\")\nnames = model.names              # dict เช่น {0: 'person', 1: 'bicycle', ...}\n\nprint(\"จำนวนคลาสทั้งหมด:\", len(names))\nfor class_id, class_name in names.items():\n    print(f\"ID {class_id}: {class_name}\")"}],"images":[],"url":""},{"id":"al3","title":"นำผลการตรวจจับไปสั่งงานบอร์ด ESP32 ผ่าน Serial Port","desc":"เชื่อม AI บนคอมพิวเตอร์เข้ากับอุปกรณ์อิเล็กทรอนิกส์ เปิด-ปิดไฟอัตโนมัติเมื่อพบคน","body":"### แนวคิดของระบบ\nคอมพิวเตอร์ทำหน้าที่ประมวลผลภาพด้วย YOLO เพราะต้องใช้กำลังประมวลผลสูง ส่วนบอร์ด ESP32 รับคำสั่งสั้น ๆ เป็นข้อความผ่านสาย USB (Serial Port) แล้วนำไปเปิด-ปิดอุปกรณ์ที่ขา GPIO เช่น LED รีเลย์ หรือออดเตือน ระบบลักษณะนี้นำไปใช้ต่อได้กับงานตรวจจับคนเข้าพื้นที่อันตราย หรือนับชิ้นงานบนสายพาน\n\n### การสื่อสารแบบอนุกรม\n- ฝั่ง Python ใช้ไลบรารี `pyserial` เปิดพอร์ต เช่น `COM7` ที่ความเร็ว 115200 bps\n- ฝั่ง ESP32 อ่านข้อความทีละบรรทัดด้วย `Serial.readStringUntil('\\n')`\n- ทั้งสองฝั่งต้องตั้งความเร็ว (Baud rate) ให้ตรงกัน\n- หาหมายเลขพอร์ตได้จาก Device Manager > Ports (COM & LPT)\n\n> ส่งคำสั่งเฉพาะตอนที่สถานะเปลี่ยน (ใช้ตัวแปร last_state) เพราะถ้าส่งทุกเฟรม พอร์ตจะทำงานหนักและบอร์ดตอบสนองช้า\n\n### ข้อควรระวัง\n- ปิดหน้าต่าง Serial Monitor ของ Arduino IDE ก่อนรันโปรแกรม Python เพราะพอร์ตเปิดได้ทีละโปรแกรม\n- บนบอร์ด ESP32-CAM ขา GPIO4 ต่อกับไฟแฟลช LED ซึ่งสว่างมาก อย่าเปิดค้างไว้นาน","code":[{"name":"esp32_serial_led.ino","lang":"cpp","src":"// esp32_serial_led.ino : รับคำสั่ง ON / OFF ทางพอร์ตอนุกรม\nconst int ledPin = 4;   // ESP32-CAM: GPIO4 คือไฟแฟลชบนบอร์ด\n\nvoid setup() {\n  pinMode(ledPin, OUTPUT);\n  digitalWrite(ledPin, LOW);\n  Serial.begin(115200);\n}\n\nvoid loop() {\n  if (Serial.available() > 0) {\n    String command = Serial.readStringUntil('\\n');\n    command.trim();                 // ตัดช่องว่างและขึ้นบรรทัดใหม่ทิ้ง\n\n    if (command == \"ON\") {\n      digitalWrite(ledPin, HIGH);\n      Serial.println(\"LED turned ON\");\n    } else if (command == \"OFF\") {\n      digitalWrite(ledPin, LOW);\n      Serial.println(\"LED turned OFF\");\n    }\n  }\n}"},{"name":"main.py","lang":"python","src":"# main.py : พบ \"person\" แล้วสั่ง ESP32 เปิดไฟผ่านพอร์ต COM\nimport cv2\nimport serial\nimport time\nfrom ultralytics import YOLO\n\nSERIAL_PORT = \"COM7\"      # ดูหมายเลขพอร์ตได้ใน Device Manager\nBAUD_RATE = 115200\nTARGET_CLASS = \"person\"\n\ntry:\n    esp32 = serial.Serial(SERIAL_PORT, BAUD_RATE, timeout=1)\n    time.sleep(2)          # รอให้บอร์ดรีเซ็ตตัวเองหลังเปิดพอร์ต\n    print(\"เชื่อมต่อ ESP32 สำเร็จ\")\nexcept Exception as e:\n    print(\"เชื่อมต่อพอร์ตไม่สำเร็จ:\", e)\n    esp32 = None\n\ndef send(cmd):\n    if esp32 and esp32.is_open:\n        esp32.write((cmd + \"\\n\").encode())\n\nmodel = YOLO(\"yolo11n.pt\")\ncap = cv2.VideoCapture(0)\nlast_state = None\n\nwhile cap.isOpened():\n    ok, frame = cap.read()\n    if not ok:\n        break\n\n    results = model(frame, conf=0.5, verbose=False)\n    found = any(model.names[int(b.cls[0])] == TARGET_CLASS for b in results[0].boxes)\n\n    # ส่งคำสั่งเฉพาะตอนสถานะเปลี่ยน ไม่ส่งซ้ำทุกเฟรม\n    if found and last_state != \"ON\":\n        send(\"ON\");  last_state = \"ON\";  print(\"พบเป้าหมาย: LED ON\")\n    elif not found and last_state != \"OFF\":\n        send(\"OFF\"); last_state = \"OFF\"; print(\"ไม่พบเป้าหมาย: LED OFF\")\n\n    cv2.imshow(\"YOLO11 + ESP32\", results[0].plot())\n    if cv2.waitKey(1) & 0xFF == ord('q'):\n        break\n\nsend(\"OFF\")\ncap.release()\ncv2.destroyAllWindows()\nif esp32:\n    esp32.close()"}],"images":[{"url":"svg/ai-pipeline.svg","cap":"ภาพที่ 2 การนำผลการตรวจจับของ AI ไปสั่งงานบอร์ด ESP32 (วาดใหม่)"}],"url":""}]},{"id":"ds2","type":"worksheets","title":"ใบงาน","note":"","items":[{"id":"aw1","title":"ใบงานที่ 1 ติดตั้งเครื่องมือและทดสอบ YOLO กับภาพนิ่ง","desc":"สร้าง Virtual Environment ติดตั้ง Ultralytics และตรวจจับวัตถุจากภาพถ่ายของตนเอง","body":"**จุดประสงค์เชิงพฤติกรรม**\n- สร้างและใช้งาน Virtual Environment ของ Python ได้\n- ติดตั้งไลบรารี ultralytics และทดสอบโมเดลได้\n- อ่านผลการตรวจจับ (คลาส ค่าความมั่นใจ) ได้ถูกต้อง\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์ที่ติดตั้ง Python 3.10\n- โปรแกรม VS Code หรือ Thonny\n- ภาพถ่ายที่มีวัตถุอย่างน้อย 3 ชนิด\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. สร้างโฟลเดอร์งานและ Virtual Environment ตามไฟล์ setup.bat\n2. ติดตั้ง ultralytics แล้วตรวจสอบด้วยคำสั่ง pip list\n3. คัดลอกภาพถ่ายของตนเองไว้ในโฟลเดอร์ แล้วแก้ชื่อไฟล์ใน detect.py\n4. รัน detect.py และบันทึกผลวัตถุที่ตรวจพบ\n5. ทดลองเปลี่ยนโมเดลเป็น yolov8s.pt แล้วเปรียบเทียบผล\n\n**บันทึกผลการปฏิบัติงาน**\n| ภาพที่ | วัตถุที่ตรวจพบ | ค่าความมั่นใจ | ถูกต้องหรือไม่ |\n|---|---|---|---|\n| 1 | | | |\n| 2 | | | |\n| 3 | | | |\n\n**คำถามท้ายใบงาน**\n1. Virtual Environment ช่วยแก้ปัญหาอะไรในการทำงานหลายโปรเจกต์\n2. โมเดล n กับ s ให้ผลต่างกันอย่างไร และใช้เวลาประมวลผลต่างกันเท่าใด\n3. วัตถุใดในภาพที่โมเดลตรวจไม่พบ เพราะเหตุใด","code":[],"images":[],"url":""},{"id":"aw2","title":"ใบงานที่ 2 ตรวจจับและนับจำนวนวัตถุแบบเรียลไทม์","desc":"ดัดแปลงโปรแกรม main.py ให้นับจำนวนคนในภาพและแสดงผลบนหน้าจอ","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เขียนโปรแกรมอ่านภาพจากกล้องและตรวจจับวัตถุแบบเรียลไทม์ได้\n- ดึงข้อมูลคลาสจากผลการตรวจจับมาประมวลผลต่อได้\n- อธิบายผลของการปรับค่า conf ได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมเว็บแคม\n- Virtual Environment จากใบงานที่ 1\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. รัน main.py และทดลองถือวัตถุต่าง ๆ หน้ากล้อง\n2. รัน classes.py แล้วเลือกคลาสที่ต้องการนับ 1 คลาส\n3. เพิ่มโค้ดนับจำนวนกรอบที่เป็นคลาสนั้นในแต่ละเฟรม\n4. ใช้ cv2.putText แสดงจำนวนที่นับได้มุมบนซ้ายของภาพ\n5. ทดลองค่า conf = 0.3, 0.5, 0.8 แล้วบันทึกผล\n\n**บันทึกผลการปฏิบัติงาน**\n| ค่า conf | จำนวนที่นับได้ | จำนวนจริง | ตรวจผิด (ครั้ง) |\n|---|---|---|---|\n| 0.3 | | | |\n| 0.5 | | | |\n| 0.8 | | | |\n\n**คำถามท้ายใบงาน**\n1. ค่า conf ใดให้ผลเหมาะสมที่สุดกับงานนับจำนวน เพราะอะไร\n2. แสงสว่างในห้องมีผลต่อการตรวจจับอย่างไร\n3. ยกตัวอย่างงานอาชีพในสาขาของตนเองที่นำระบบนับวัตถุไปใช้ได้","code":[],"images":[],"url":""},{"id":"aw3","title":"ใบงานที่ 3 ระบบเปิดไฟอัตโนมัติเมื่อตรวจพบคน","desc":"เชื่อมโปรแกรม YOLO กับบอร์ด ESP32 ผ่าน Serial Port เพื่อเปิด-ปิด LED","body":"**จุดประสงค์เชิงพฤติกรรม**\n- เขียนโปรแกรม ESP32 รับคำสั่งผ่านพอร์ตอนุกรมได้\n- ส่งคำสั่งจาก Python ไปยังบอร์ดด้วย pyserial ได้\n- ออกแบบเงื่อนไขส่งคำสั่งเฉพาะเมื่อสถานะเปลี่ยนได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์พร้อมเว็บแคม\n- บอร์ด ESP32 พร้อมสาย USB (ถ้าใช้ ESP32-CAM ต้องมีบอร์ดอัปโหลด ESP32-CAM-MB หรือตัวแปลง USB-TTL เพราะบอร์ดไม่มีพอร์ต USB)\n- LED และตัวต้านทาน 220 Ω (ถ้าไม่ใช้ไฟแฟลชบนบอร์ด)\n- Arduino IDE ที่ติดตั้งบอร์ด ESP32 แล้ว\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. อัปโหลด esp32_serial_led.ino ลงบอร์ด\n2. เปิด Serial Monitor (115200) พิมพ์ ON และ OFF เพื่อทดสอบ แล้วปิดหน้าต่าง\n3. ตรวจหมายเลขพอร์ตใน Device Manager และแก้ค่า SERIAL_PORT ใน main.py\n4. รัน main.py แล้วเดินเข้า-ออกหน้ากล้อง\n5. เปลี่ยน TARGET_CLASS เป็นวัตถุอื่น เช่น bottle แล้วทดสอบอีกครั้ง\n\n**บันทึกผลการปฏิบัติงาน**\n| สถานการณ์ | ข้อความในหน้าต่าง Python | สถานะ LED |\n|---|---|---|\n| มีคนหน้ากล้อง | | |\n| ไม่มีคน | | |\n| ถือขวด (TARGET = bottle) | | |\n\n**คำถามท้ายใบงาน**\n1. ถ้าไม่ใช้ตัวแปร last_state จะเกิดปัญหาอะไร\n2. เพราะเหตุใดต้องรอ 2 วินาทีหลังเปิดพอร์ต\n3. ออกแบบระบบความปลอดภัยในโรงงานที่ใช้หลักการเดียวกันนี้ 1 ระบบ","code":[],"images":[],"url":""}]},{"id":"ds3","type":"gallery","title":"รูปเพิ่มเติม","note":"","items":[{"id":"ag1","title":"นักเรียนฝึกปฏิบัติงานกับคอมพิวเตอร์และชุดทดลอง","desc":"","url":"img/computer-lab.jpg"}]}],"refs":[{"title":"Ultralytics YOLO Documentation","url":"https://docs.ultralytics.com/"},{"title":"Roboflow (ติดฉลากและจัดการชุดข้อมูลภาพ)","url":"https://roboflow.com/"}]},{"id":"c30100-1003","code":"30100-1003","name":"กฎหมายในงานอาชีพอุตสาหกรรมพลังงาน ไฟฟ้า และอิเล็กทรอนิกส์","t":1,"p":0,"n":1,"h":1,"slots":[{"d":4,"s":"16:00","e":"17:00","room":"8306","group":"สทอ.2/1"}],"sections":[{"id":"fs1","type":"lessons","title":"เนื้อหา","note":"","items":[{"id":"ll1","title":"หน่วยที่ 1 ความรู้เบื้องต้นเกี่ยวกับกฎหมายและข้อกำหนดในงานอาชีพ","desc":"ความหมายของกฎหมาย ลำดับศักดิ์ ความต่างระหว่างกฎหมายกับมาตรฐาน และการสืบค้นจากแหล่งทางการ","body":"### ขอบเขตของรายวิชา\nรายวิชานี้ศึกษาข้อกำหนดและกฎหมายที่เกี่ยวข้องกับงานอาชีพการผลิตและการบริการในสาขาที่เรียน รวมถึงกฎหมายเกี่ยวกับความปลอดภัย สิ่งแวดล้อม และทรัพย์สินทางปัญญา เพื่อให้นำข้อกำหนดไปปฏิบัติในงานอาชีพได้อย่างถูกต้องและมีจรรยาบรรณ\n\n### ลำดับศักดิ์ของกฎหมาย\nกฎหมายที่ช่างไฟฟ้าและอิเล็กทรอนิกส์พบบ่อยมีหลายระดับ กฎหมายระดับต่ำกว่าต้องออกโดยอาศัยอำนาจของกฎหมายระดับสูงกว่า และขัดหรือแย้งกับกฎหมายที่สูงกว่าไม่ได้\n1. รัฐธรรมนูญ\n2. พระราชบัญญัติ (พ.ร.บ.) พระราชกำหนด และประมวลกฎหมาย\n3. พระราชกฤษฎีกา\n4. กฎกระทรวง\n5. ประกาศ ระเบียบ และข้อบังคับของหน่วยงาน\n\nตัวอย่าง: **พ.ร.บ.ความปลอดภัย อาชีวอนามัย และสภาพแวดล้อมในการทำงาน พ.ศ. 2554** ให้อำนาจรัฐมนตรีออก **กฎกระทรวงฯ เกี่ยวกับไฟฟ้า พ.ศ. 2558** ซึ่งกำหนดรายละเอียดที่นายจ้างและลูกจ้างต้องปฏิบัติ\n\n### กฎหมายกับมาตรฐาน\n| ประเภท | ลักษณะ | ตัวอย่าง |\n|---|---|---|\n| กฎหมาย | บังคับทุกคน มีบทลงโทษ | พ.ร.บ. กฎกระทรวง |\n| มาตรฐานบังคับ | กฎหมายกำหนดให้ต้องปฏิบัติตาม | ผลิตภัณฑ์ที่ต้องได้รับเครื่องหมาย มอก. บังคับ |\n| มาตรฐานทั่วไป | เป็นแนวปฏิบัติที่ดี แต่กฎหมายอาจอ้างถึง | มาตรฐานการติดตั้งทางไฟฟ้าสำหรับประเทศไทย (วสท.) |\n\n### การสืบค้นกฎหมายจากแหล่งทางการ\n- **ราชกิจจานุเบกษา** แหล่งประกาศกฎหมายฉบับจริง กฎหมายมีผลเมื่อประกาศแล้วตามวันที่กำหนด\n- **ระบบกลางทางกฎหมาย / สำนักงานคณะกรรมการกฤษฎีกา** ค้นตัวบทกฎหมายฉบับปัจจุบันที่รวมการแก้ไขแล้ว\n- เวลาอ่านกฎหมายให้ดู ชื่อ ปี พ.ศ. ฉบับที่แก้ไข และหน่วยงานที่รักษาการตามกฎหมาย","code":[],"images":[{"url":"svg/law-hierarchy.svg","cap":"ภาพที่ 1 ลำดับศักดิ์ของกฎหมาย และตัวอย่างในงานไฟฟ้า (วาดใหม่)"}],"url":""},{"id":"ll2","title":"หน่วยที่ 2 กฎหมายควบคุมการประกอบอาชีพช่างและวิศวกร","desc":"หนังสือรับรองความรู้ความสามารถของช่างไฟฟ้าภายในอาคาร และใบอนุญาตประกอบวิชาชีพวิศวกรรมควบคุม","body":"### พ.ร.บ.ส่งเสริมการพัฒนาฝีมือแรงงาน พ.ศ. 2545 (แก้ไขเพิ่มเติม พ.ศ. 2557)\nกฎหมายนี้กำหนดให้สาขาอาชีพที่อาจเป็นอันตรายต่อสาธารณะ ต้องให้ผู้ที่มี **หนังสือรับรองความรู้ความสามารถ** เป็นผู้ทำงานเท่านั้น กระทรวงแรงงานประกาศให้ **ช่างไฟฟ้าภายในอาคาร** เป็นหนึ่งในสาขาอาชีพดังกล่าว ผู้ทำงานโดยไม่มีหนังสือรับรองมีความผิดตามกฎหมาย ถูกปรับไม่เกิน 5,000 บาท ส่วนนายจ้างหรือสถานประกอบกิจการที่จ้างช่างที่ไม่มีหนังสือรับรอง ถูกปรับไม่เกิน 30,000 บาท\n- ยื่นขอประเมินได้ที่สถาบัน/สำนักงานพัฒนาฝีมือแรงงานในจังหวัด\n- การประเมินมีทั้งภาคความรู้และภาคปฏิบัติตามมาตรฐานฝีมือแรงงานแห่งชาติ\n- นักศึกษาสาขาไฟฟ้าและอิเล็กทรอนิกส์ควรวางแผนสอบตั้งแต่ระหว่างเรียน\n\n### พ.ร.บ.วิศวกร พ.ศ. 2542\nงานวิศวกรรมบางประเภทกำหนดเป็น **วิศวกรรมควบคุม** ผู้ทำงานต้องได้รับใบอนุญาตประกอบวิชาชีพจาก **สภาวิศวกร** (เรียกทั่วไปว่า ใบ กว.) สาขาวิศวกรรมไฟฟ้าแบ่งเป็นแขนงไฟฟ้ากำลังและไฟฟ้าสื่อสาร ผู้ขอใบอนุญาตต้องสำเร็จการศึกษาระดับปริญญาวิศวกรรมศาสตร์จากหลักสูตรที่สภาวิศวกรรับรอง และผ่านการทดสอบ\n\n### เส้นทางอาชีพของนักศึกษา ปวส.\n| ระดับ | สิ่งที่ต้องมี | ตัวอย่างงาน |\n|---|---|---|\n| ช่างไฟฟ้าภายในอาคาร | หนังสือรับรองความรู้ความสามารถ | เดินสายไฟ ติดตั้งแผงควบคุมในอาคาร |\n| ช่างเทคนิค | วุฒิ ปวส. และประสบการณ์ | บำรุงรักษาเครื่องจักร ติดตั้งระบบควบคุม |\n| วิศวกร | ปริญญาวิศวกรรมศาสตร์ + ใบอนุญาต กว. | ออกแบบ ตรวจสอบ และรับรองงานระบบไฟฟ้า |\n\n> งานบางอย่าง เช่น แผนผังวงจรไฟฟ้าตามกฎกระทรวง ปี 2558 ต้องได้รับการรับรองจากวิศวกรหรือการไฟฟ้า ช่างจึงต้องรู้ขอบเขตอำนาจหน้าที่ของตนเอง","code":[],"images":[],"url":""},{"id":"ll3","title":"หน่วยที่ 3 กฎหมายความปลอดภัยในการทำงานเกี่ยวกับไฟฟ้า","desc":"สาระสำคัญของกฎกระทรวงความปลอดภัยฯ เกี่ยวกับไฟฟ้า พ.ศ. 2558 และผลงานวิจัยด้านพฤติกรรมความปลอดภัย","body":"### กฎกระทรวงกำหนดมาตรฐานในการบริหาร จัดการ และดำเนินการด้านความปลอดภัยฯ เกี่ยวกับไฟฟ้า พ.ศ. 2558\nออกตาม พ.ร.บ.ความปลอดภัย อาชีวอนามัย และสภาพแวดล้อมในการทำงาน พ.ศ. 2554 สาระสำคัญที่ช่างต้องรู้\n\n| เรื่อง | สาระสำคัญ |\n|---|---|\n| แผนผังวงจรไฟฟ้า | นายจ้างต้องมีและเก็บแผนผังวงจรไฟฟ้าที่ได้รับการรับรองจากวิศวกรหรือการไฟฟ้า |\n| ป้ายเตือน (ข้อ 6) | ติดป้ายหรือสัญลักษณ์เตือนอันตรายจากไฟฟ้าในบริเวณที่อาจเกิดอันตราย |\n| ระยะห่าง (ข้อ 7–8) | ห้ามลูกจ้างเข้าใกล้สิ่งที่มีกระแสไฟฟ้าในระยะน้อยกว่ามาตรฐานของวิศวกรรมสถานแห่งประเทศไทย (วสท.) และห้ามผู้ไม่เกี่ยวข้องเข้าใกล้ |\n| อุปกรณ์ป้องกัน (ข้อ 10, 22) | อุปกรณ์ฉนวนและอุปกรณ์ป้องกันต้องเหมาะกับแรงดันสูงสุดในบริเวณปฏิบัติงาน |\n| ล็อกและติดป้าย (ข้อ 15) | ขณะทำงานต้องมีอุปกรณ์ล็อกหรือระบบป้องกันการสับสวิตช์ พร้อมป้ายห้ามสับ |\n| ที่กั้นและแผ่นฉนวน (ข้อ 17) | บริภัณฑ์ที่ใช้แรงดันเกิน 50 V ต้องมีที่ปิดกั้นหรือแผ่นฉนวนปูพื้นป้องกันการสัมผัส |\n| เครื่องกำเนิดไฟฟ้า (ข้อ 19) | ติดตั้งในที่กว้างพอ ระบายอากาศ ต่อท่อไอเสียออกนอกห้อง มีอุปกรณ์ป้องกันกระแสเกินและเครื่องดับเพลิง |\n| ฟ้าผ่า | ต้องมีระบบป้องกันฟ้าผ่าตามมาตรฐาน |\n\n> ตารางนี้เป็นการสรุปความเพื่อการเรียน ก่อนนำไปใช้ในงานจริงให้ตรวจกับตัวบทฉบับราชกิจจานุเบกษา\n\n### ขั้นตอนตัดไฟและล็อก (Lockout/Tagout) ที่ควรฝึกจนเป็นนิสัย\n1. แจ้งผู้เกี่ยวข้องว่าจะหยุดจ่ายไฟ\n2. ปลดเบรกเกอร์หรือสวิตช์ตัดตอนของวงจรที่จะทำงาน\n3. คล้องกุญแจและแขวนป้าย “ห้ามสับ กำลังปฏิบัติงาน” พร้อมชื่อผู้ปฏิบัติงาน\n4. ตรวจด้วยเครื่องวัดว่าไม่มีแรงดันจริง ก่อนสัมผัสวงจร\n5. เมื่อเสร็จงาน ผู้ที่ล็อกเท่านั้นเป็นผู้ปลดกุญแจ แล้วแจ้งก่อนจ่ายไฟคืน\n\n### ผลงานวิจัยที่เกี่ยวข้อง\n- **วริยา เคนทวาย (2564)** ศึกษาพนักงานระดับปฏิบัติการ การไฟฟ้าส่วนภูมิภาค จังหวัดปทุมธานี 50 คน พบว่าพฤติกรรมด้านการปฏิบัติตามกฎระเบียบความปลอดภัยมีค่าเฉลี่ยสูงที่สุด รองลงมาคือการใช้เครื่องมือและอุปกรณ์ป้องกัน และเสนอให้มีนโยบายความปลอดภัยที่ชัดเจนและใช้อุปกรณ์ป้องกันอย่างสม่ำเสมอ\n- **ภิญโญ สุโรจนานนท์ และคณะ** ศึกษาผู้ปฏิบัติงานก่อสร้างระบบจำหน่าย กฟภ.อำเภอโคกสำโรง พบว่าผู้ปฏิบัติงานบางส่วนทำงานตามความเคยชิน และเลือกทำงานเสี่ยงมากกว่าใช้อุปกรณ์ป้องกัน โดยสาเหตุสำคัญของปัญหาคือ **การบริหารจัดการความปลอดภัยที่เป็นรูปธรรม**\n- **อ.เตชทัต บูรณะอัศวกุล** (มหาวิทยาลัยราชภัฏธนบุรี) สรุปหน้าที่ตามกฎกระทรวงฯ ไว้สำหรับเจ้าหน้าที่ความปลอดภัย เช่น ต้องมีผังวงจรที่วิศวกรรับรอง มีระยะห่างตามมาตรฐาน วสท. และใช้ PPE ให้เหมาะกับลักษณะงานไฟฟ้า\n\n> ข้อสรุปจากงานวิจัย: กฎหมายอย่างเดียวไม่พอ ต้องมีการบริหารจัดการ การฝึกอบรม และวัฒนธรรมความปลอดภัยในที่ทำงาน","code":[],"images":[],"url":""},{"id":"ll4","title":"หน่วยที่ 4 กฎหมายมาตรฐานผลิตภัณฑ์ การติดตั้ง และพลังงาน","desc":"มาตรฐานผลิตภัณฑ์อุตสาหกรรม (มอก.) มาตรฐานการติดตั้งทางไฟฟ้า และกฎหมายด้านพลังงาน","body":"### พ.ร.บ.มาตรฐานผลิตภัณฑ์อุตสาหกรรม พ.ศ. 2511\n- กำหนดมาตรฐานผลิตภัณฑ์ (มอก.) โดยสำนักงานมาตรฐานผลิตภัณฑ์อุตสาหกรรม (สมอ.)\n- ผลิตภัณฑ์ที่มีพระราชกฤษฎีกากำหนดให้ต้องเป็นไปตามมาตรฐาน เรียกว่า **สินค้าควบคุม** ผู้ผลิตและผู้นำเข้าต้องได้รับใบอนุญาตก่อนจำหน่าย เครื่องใช้ไฟฟ้าและสายไฟฟ้าหลายชนิดอยู่ในกลุ่มนี้\n- ช่างควรเลือกใช้สายไฟ เบรกเกอร์ และอุปกรณ์ที่มีเครื่องหมาย มอก. ถูกต้องตามประเภทงาน\n\n### มาตรฐานการติดตั้งทางไฟฟ้าสำหรับประเทศไทย (วสท.)\nจัดทำโดยวิศวกรรมสถานแห่งประเทศไทย กำหนดวิธีเลือกขนาดสาย การป้องกันกระแสเกิน การต่อลงดิน และระยะห่างความปลอดภัย กฎกระทรวงความปลอดภัยเกี่ยวกับไฟฟ้า พ.ศ. 2558 อ้างอิงมาตรฐานนี้ในเรื่องระยะห่าง จึงมีผลในทางปฏิบัติเสมือนข้อบังคับ\n\n### กฎหมายด้านพลังงาน\n| กฎหมาย | สาระสำคัญสำหรับช่าง |\n|---|---|\n| พ.ร.บ.การส่งเสริมการอนุรักษ์พลังงาน พ.ศ. 2535 (แก้ไข 2550) | โรงงานและอาคารควบคุมต้องจัดการพลังงาน มีผู้รับผิดชอบด้านพลังงาน และรายงานผล |\n| พ.ร.บ.การประกอบกิจการพลังงาน พ.ศ. 2550 | จัดตั้งคณะกรรมการกำกับกิจการพลังงาน (กกพ.) การผลิตและจำหน่ายไฟฟ้าต้องได้รับอนุญาตตามหลักเกณฑ์ เช่น การติดตั้งโซลาร์เซลล์ขายไฟคืน |\n\n> ก่อนติดตั้งระบบผลิตไฟฟ้าหรือเชื่อมต่อกับระบบของการไฟฟ้า ต้องตรวจหลักเกณฑ์ล่าสุดของการไฟฟ้าส่วนภูมิภาค/นครหลวง และ กกพ. เพราะมีการปรับปรุงเป็นระยะ","code":[],"images":[],"url":""},{"id":"ll5","title":"หน่วยที่ 5 กฎหมายสิ่งแวดล้อม โรงงาน และขยะอิเล็กทรอนิกส์","desc":"พ.ร.บ.โรงงาน กฎหมายสิ่งแวดล้อม และสถานะการจัดการซากผลิตภัณฑ์เครื่องใช้ไฟฟ้าในประเทศไทย","body":"### พ.ร.บ.โรงงาน พ.ศ. 2535 และฉบับแก้ไข พ.ศ. 2562\n- ควบคุมการตั้งและประกอบกิจการโรงงาน รวมถึงโรงงานคัดแยกและรีไซเคิลซากอิเล็กทรอนิกส์\n- ฉบับแก้ไข พ.ศ. 2562 ปรับนิยามโรงงานจากเครื่องจักร 5 แรงม้าหรือคนงาน 7 คน เป็น **50 แรงม้าหรือคนงาน 50 คน** ยกเลิกการต่ออายุใบอนุญาต รง.4 ทุก 5 ปี และเพิ่มการตรวจสอบโดยบุคคลที่สาม\n\n### กฎหมายสิ่งแวดล้อมที่เกี่ยวข้อง\n- พ.ร.บ.ส่งเสริมและรักษาคุณภาพสิ่งแวดล้อมแห่งชาติ พ.ศ. 2535 กำหนดมาตรฐานคุณภาพสิ่งแวดล้อมและการควบคุมมลพิษ\n- กฎกระทรวงว่าด้วยการจัดการมูลฝอยที่เป็นพิษหรืออันตรายจากชุมชน พ.ศ. 2563 กำหนดให้แยกขยะอันตราย (รวมถึงซากเครื่องใช้ไฟฟ้า หลอดไฟ แบตเตอรี่) ออกจากขยะทั่วไป\n\n### สถานการณ์ขยะอิเล็กทรอนิกส์ (ข้อมูลกรมควบคุมมลพิษ)\n- ประเทศไทยมีซากผลิตภัณฑ์เครื่องใช้ไฟฟ้าและอิเล็กทรอนิกส์ประมาณ **400,000 ตันต่อปี**\n- ยังไม่มีกฎหมายเฉพาะด้านขยะอิเล็กทรอนิกส์ ปัจจุบันใช้กฎหมายหลายฉบับร่วมกัน\n- **(ร่าง) พ.ร.บ.การจัดการซากผลิตภัณฑ์เครื่องใช้ไฟฟ้าและอุปกรณ์อิเล็กทรอนิกส์** ใช้หลักความรับผิดชอบที่เพิ่มขึ้นของผู้ผลิต (EPR) ยังอยู่ระหว่างการพิจารณา\n- กระทรวงพาณิชย์ประกาศให้ขยะอิเล็กทรอนิกส์ **428 รายการ** เป็นสินค้าต้องห้ามนำเข้า (พ.ศ. 2563)\n\n> ซากแผงวงจรมีโลหะหนัก เช่น ตะกั่ว ปรอท และแคดเมียม การรื้อหรือเผาเองโดยไม่มีระบบป้องกันเป็นอันตรายต่อสุขภาพและสิ่งแวดล้อม ควรส่งให้จุดรับคืนหรือผู้ประกอบการที่ได้รับอนุญาต","code":[],"images":[],"url":""},{"id":"ll6","title":"หน่วยที่ 6 ทรัพย์สินทางปัญญาในงานอิเล็กทรอนิกส์และซอฟต์แวร์","desc":"ลิขสิทธิ์ สิทธิบัตร อนุสิทธิบัตร แบบผังภูมิวงจรรวม และการใช้ซอฟต์แวร์โอเพนซอร์สอย่างถูกต้อง","body":"### ประเภทของทรัพย์สินทางปัญญาที่ช่างควรรู้\n| ประเภท | คุ้มครองอะไร | อายุการคุ้มครอง |\n|---|---|---|\n| ลิขสิทธิ์ | งานสร้างสรรค์ รวมถึงโปรแกรมคอมพิวเตอร์ (ถือเป็นงานวรรณกรรม) | ตลอดอายุผู้สร้างสรรค์ + 50 ปี (นิติบุคคล 50 ปีนับแต่สร้างสรรค์) |\n| สิทธิบัตรการประดิษฐ์ | สิ่งประดิษฐ์ใหม่ มีขั้นการประดิษฐ์สูงขึ้น ประยุกต์ใช้ในอุตสาหกรรมได้ | 20 ปีนับแต่วันยื่นคำขอ |\n| สิทธิบัตรการออกแบบผลิตภัณฑ์ | รูปร่างหรือลวดลายของผลิตภัณฑ์ | 10 ปีนับแต่วันยื่นคำขอ |\n| อนุสิทธิบัตร | สิ่งประดิษฐ์ใหม่ที่ประยุกต์ใช้ในอุตสาหกรรมได้ (ไม่ต้องมีขั้นการประดิษฐ์สูง) | 6 ปี ต่ออายุได้ 2 ครั้ง ครั้งละ 2 ปี |\n| แบบผังภูมิของวงจรรวม | การจัดวางวงจรบนชิป ที่สร้างขึ้นเองและไม่เป็นที่รู้จักทั่วไป | 10 ปี (รวมแล้วไม่เกิน 15 ปีนับแต่สร้างเสร็จ) |\n| เครื่องหมายการค้า | ชื่อ ตราสัญลักษณ์ของสินค้าและบริการ | 10 ปี ต่ออายุได้ครั้งละ 10 ปี |\n\n### อนุสิทธิบัตรกับผลงานนักเรียน\nสิ่งประดิษฐ์ของนักเรียนอาชีวศึกษาจำนวนมากเป็นการปรับปรุงของเดิมให้ใช้งานได้ดีขึ้น หากเป็นของใหม่และใช้ในอุตสาหกรรมได้ ก็ยื่นขอ **อนุสิทธิบัตร** ได้ เพราะไม่ต้องพิสูจน์ขั้นการประดิษฐ์ที่สูงขึ้น ก่อนยื่นต้องสืบค้นว่ายังไม่มีผู้ใดยื่นไว้ และควรหลีกเลี่ยงการเผยแพร่ผลงานต่อสาธารณะก่อนยื่นคำขอ เพราะอาจทำให้ผลงานไม่ถือว่าเป็นของใหม่\n\n### การใช้โค้ดและไลบรารีของผู้อื่น\n- โค้ดตัวอย่างและไลบรารี Arduino ส่วนใหญ่เผยแพร่ภายใต้สัญญาอนุญาตโอเพนซอร์ส เช่น MIT หรือ GPL ซึ่งมีเงื่อนไขต่างกัน\n- ต้องอ่านสัญญาอนุญาต อ้างอิงแหล่งที่มา และไม่ลบข้อความลิขสิทธิ์ของเจ้าของเดิม\n- การคัดลอกโปรแกรมเชิงพาณิชย์หรือใช้ซอฟต์แวร์ละเมิดลิขสิทธิ์ในงาน มีความผิดตาม พ.ร.บ.ลิขสิทธิ์","code":[],"images":[],"url":""}]},{"id":"fs2","type":"worksheets","title":"ใบงาน","note":"","items":[{"id":"lw1","title":"ใบงานที่ 1 สืบค้นกฎหมายจากแหล่งทางการ","desc":"สืบค้นกฎหมาย 5 ฉบับที่เกี่ยวข้องกับงานไฟฟ้าและอิเล็กทรอนิกส์แล้วสรุปสาระสำคัญ","body":"**จุดประสงค์เชิงพฤติกรรม**\n- สืบค้นตัวบทกฎหมายจากแหล่งทางการได้\n- จำแนกประเภทและลำดับศักดิ์ของกฎหมายได้\n- สรุปสาระสำคัญที่เกี่ยวข้องกับงานอาชีพได้\n\n**เครื่องมือและอุปกรณ์**\n- คอมพิวเตอร์หรือโทรศัพท์ที่เชื่อมต่ออินเทอร์เน็ต\n- เว็บไซต์ราชกิจจานุเบกษา และระบบกลางทางกฎหมาย\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. แบ่งกลุ่ม กลุ่มละ 3–4 คน\n2. สืบค้นกฎหมายตามรายชื่อในตาราง\n3. ระบุประเภท ปี พ.ศ. และหน่วยงานที่รับผิดชอบ\n4. สรุปสาระสำคัญที่เกี่ยวกับงานช่างไม่เกิน 3 บรรทัดต่อฉบับ\n5. นำเสนอหน้าชั้นเรียนกลุ่มละ 5 นาที\n\n**บันทึกผลการปฏิบัติงาน**\n| ชื่อกฎหมาย | ประเภท | ปี พ.ศ. | หน่วยงานรับผิดชอบ | สาระสำคัญต่องานช่าง |\n|---|---|---|---|---|\n| ความปลอดภัยฯ เกี่ยวกับไฟฟ้า | | | | |\n| ส่งเสริมการพัฒนาฝีมือแรงงาน | | | | |\n| มาตรฐานผลิตภัณฑ์อุตสาหกรรม | | | | |\n| ลิขสิทธิ์ | | | | |\n| โรงงาน | | | | |\n\n**คำถามท้ายใบงาน**\n1. กฎกระทรวงความปลอดภัยฯ เกี่ยวกับไฟฟ้า ออกโดยอาศัยอำนาจตามกฎหมายฉบับใด\n2. มาตรฐาน วสท. เป็นกฎหมายหรือไม่ และมีผลบังคับในทางปฏิบัติอย่างไร","code":[],"images":[],"url":""},{"id":"lw2","title":"ใบงานที่ 2 วิเคราะห์กรณีศึกษาการประกอบอาชีพช่าง","desc":"วิเคราะห์สถานการณ์ว่างานใดต้องใช้หนังสือรับรองความรู้ความสามารถหรือใบอนุญาตวิศวกร","body":"**จุดประสงค์เชิงพฤติกรรม**\n- อธิบายข้อกำหนดของ พ.ร.บ.ส่งเสริมการพัฒนาฝีมือแรงงาน ที่เกี่ยวกับช่างไฟฟ้าภายในอาคารได้\n- จำแนกงานที่อยู่ในขอบเขตของช่างและวิศวกรได้\n\n**เครื่องมือและอุปกรณ์**\n- เนื้อหาหน่วยที่ 2\n- กรณีศึกษาในใบงาน\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. อ่านกรณีศึกษาต่อไปนี้ แล้ววิเคราะห์เป็นรายบุคคล\n2. กรณีที่ 1: นาย ก. จบ ปวช. รับจ้างเดินสายไฟในบ้านโดยไม่มีหนังสือรับรอง\n3. กรณีที่ 2: บริษัทให้ช่างเทคนิคลงนามรับรองแผนผังวงจรไฟฟ้าของโรงงาน\n4. กรณีที่ 3: นักศึกษาฝึกงานติดตั้งปลั๊กไฟภายใต้การควบคุมของช่างที่มีหนังสือรับรอง\n5. อภิปรายผลร่วมกันในชั้นเรียน\n\n**บันทึกผลการปฏิบัติงาน**\n| กรณี | ถูกต้องตามกฎหมายหรือไม่ | กฎหมายที่เกี่ยวข้อง | ข้อเสนอแนะ |\n|---|---|---|---|\n| 1 | | | |\n| 2 | | | |\n| 3 | | | |\n\n**คำถามท้ายใบงาน**\n1. การมีหนังสือรับรองความรู้ความสามารถเป็นประโยชน์ต่อผู้ว่าจ้างอย่างไร\n2. วางแผนเส้นทางอาชีพของตนเองหลังจบ ปวส. ว่าต้องมีคุณวุฒิหรือใบรับรองใดบ้าง","code":[],"images":[],"url":""},{"id":"lw3","title":"ใบงานที่ 3 ตรวจประเมินความปลอดภัยทางไฟฟ้าในห้องปฏิบัติการ","desc":"ใช้แบบตรวจตามกฎกระทรวง พ.ศ. 2558 สำรวจห้องปฏิบัติการของแผนกวิชา","body":"**จุดประสงค์เชิงพฤติกรรม**\n- ระบุข้อกำหนดของกฎกระทรวงความปลอดภัยฯ เกี่ยวกับไฟฟ้าได้\n- สำรวจและเสนอแนวทางแก้ไขความไม่ปลอดภัยได้\n\n**เครื่องมือและอุปกรณ์**\n- แบบตรวจในใบงาน\n- กล้องโทรศัพท์สำหรับบันทึกภาพ (ไม่เปิดตู้ไฟหรือแตะอุปกรณ์ขณะสำรวจ)\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. สำรวจห้องปฏิบัติการภายใต้การควบคุมของครูผู้สอน\n2. ตรวจตามรายการในตาราง บันทึกผลและถ่ายภาพหลักฐาน\n3. จัดลำดับความเสี่ยงที่พบ (สูง กลาง ต่ำ)\n4. เขียนข้อเสนอแนะการแก้ไขอย่างน้อย 3 ข้อ\n\n**บันทึกผลการปฏิบัติงาน**\n| รายการตรวจ | มี/ผ่าน | ไม่มี/ไม่ผ่าน | หมายเหตุ |\n|---|---|---|---|\n| แผนผังวงจรไฟฟ้าของห้อง | | | |\n| ป้ายเตือนอันตรายที่ตู้ไฟ | | | |\n| พื้นที่หน้าตู้ไฟโล่ง ไม่มีสิ่งกีดขวาง | | | |\n| กุญแจและป้ายห้ามสับสำหรับงานซ่อม | | | |\n| แผ่นฉนวนหรือที่กั้นบริเวณบริภัณฑ์ > 50 V | | | |\n| ถุงมือฉนวนและอุปกรณ์ป้องกันส่วนบุคคล | | | |\n| เครื่องดับเพลิงที่เหมาะกับไฟฟ้า | | | |\n\n**คำถามท้ายใบงาน**\n1. ความเสี่ยงที่สำคัญที่สุดที่พบคืออะไร ควรแก้ไขอย่างไร\n2. จากงานวิจัยในหน่วยที่ 3 เหตุใดการมีกฎระเบียบอย่างเดียวจึงไม่เพียงพอ","code":[],"images":[],"url":""},{"id":"lw4","title":"ใบงานที่ 4 อ่านเครื่องหมาย มอก. และฉลากผลิตภัณฑ์ไฟฟ้า","desc":"ตรวจเครื่องหมายมาตรฐานบนอุปกรณ์ไฟฟ้าจริง และเลือกใช้ผลิตภัณฑ์ให้ถูกต้อง","body":"**จุดประสงค์เชิงพฤติกรรม**\n- อธิบายความแตกต่างของมาตรฐานบังคับและมาตรฐานทั่วไปได้\n- ตรวจสอบเครื่องหมาย มอก. บนผลิตภัณฑ์ได้\n\n**เครื่องมือและอุปกรณ์**\n- อุปกรณ์ไฟฟ้าตัวอย่าง เช่น ปลั๊กพ่วง สายไฟ เบรกเกอร์ หลอด LED\n- โทรศัพท์สำหรับค้นข้อมูลจากเว็บไซต์ สมอ.\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. สำรวจอุปกรณ์ตัวอย่างอย่างน้อย 5 ชิ้น\n2. บันทึกเลข มอก. และข้อมูลบนฉลาก\n3. สืบค้นว่าผลิตภัณฑ์นั้นเป็นสินค้าควบคุมหรือไม่\n4. สรุปข้อควรระวังในการเลือกซื้อ\n\n**บันทึกผลการปฏิบัติงาน**\n| อุปกรณ์ | เลข มอก. | สินค้าควบคุมหรือไม่ | พิกัดแรงดัน/กระแส | ข้อสังเกต |\n|---|---|---|---|---|\n| | | | | |\n| | | | | |\n| | | | | |\n\n**คำถามท้ายใบงาน**\n1. ถ้าพบปลั๊กพ่วงที่ไม่มีเครื่องหมาย มอก. ควรทำอย่างไร\n2. เหตุใดช่างต้องเลือกใช้อุปกรณ์ที่ได้มาตรฐาน แม้ลูกค้าต้องการของราคาถูก","code":[],"images":[],"url":""},{"id":"lw5","title":"ใบงานที่ 5 จัดการซากอิเล็กทรอนิกส์อย่างถูกต้อง","desc":"ออกแบบแนวทางจัดการซากอุปกรณ์ในห้องปฏิบัติการของแผนกวิชา","body":"**จุดประสงค์เชิงพฤติกรรม**\n- อธิบายสถานการณ์และกฎหมายที่เกี่ยวข้องกับขยะอิเล็กทรอนิกส์ได้\n- ออกแบบแนวทางคัดแยกและส่งต่อซากอิเล็กทรอนิกส์ได้\n\n**เครื่องมือและอุปกรณ์**\n- เนื้อหาหน่วยที่ 5\n- ข้อมูลจุดรับคืนขยะอันตรายในจังหวัด\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. สำรวจซากอุปกรณ์ที่ไม่ใช้แล้วในแผนก จำแนกประเภท\n2. ระบุสารอันตรายที่อาจมีในแต่ละประเภท\n3. สืบค้นจุดรับคืนหรือผู้ประกอบการที่ได้รับอนุญาต\n4. จัดทำโปสเตอร์ 1 หน้า เรื่อง การทิ้งซากอิเล็กทรอนิกส์อย่างปลอดภัย\n\n**บันทึกผลการปฏิบัติงาน**\n| ซากอุปกรณ์ | จำนวน | สารอันตรายที่อาจมี | วิธีจัดการที่เสนอ |\n|---|---|---|---|\n| แบตเตอรี่ | | | |\n| แผงวงจร | | | |\n| หลอดไฟ | | | |\n\n**คำถามท้ายใบงาน**\n1. หลักความรับผิดชอบที่เพิ่มขึ้นของผู้ผลิต (EPR) หมายถึงอะไร\n2. นักศึกษาช่วยลดขยะอิเล็กทรอนิกส์ได้อย่างไรบ้าง","code":[],"images":[],"url":""},{"id":"lw6","title":"ใบงานที่ 6 ตรวจทรัพย์สินทางปัญญาในโครงงาน","desc":"ตรวจสอบโค้ดและผลงานในโครงงานของตนเอง และประเมินความเป็นไปได้ในการยื่นอนุสิทธิบัตร","body":"**จุดประสงค์เชิงพฤติกรรม**\n- จำแนกประเภททรัพย์สินทางปัญญาและอายุการคุ้มครองได้\n- อ้างอิงแหล่งที่มาของโค้ดและไลบรารีได้ถูกต้อง\n- ประเมินผลงานเบื้องต้นเพื่อยื่นขออนุสิทธิบัตรได้\n\n**เครื่องมือและอุปกรณ์**\n- โครงงานหรือชิ้นงานของนักศึกษา\n- ระบบสืบค้นสิทธิบัตรของกรมทรัพย์สินทางปัญญา\n\n**ลำดับขั้นการปฏิบัติงาน**\n1. ทำรายการไลบรารีและโค้ดที่นำมาใช้ พร้อมสัญญาอนุญาต\n2. สืบค้นสิทธิบัตรหรืออนุสิทธิบัตรที่คล้ายกับผลงาน\n3. ระบุจุดที่เป็นของใหม่ในผลงานของตนเอง\n4. สรุปว่าควรยื่นอนุสิทธิบัตรหรือไม่ พร้อมเหตุผล\n\n**บันทึกผลการปฏิบัติงาน**\n| สิ่งที่นำมาใช้ | แหล่งที่มา | สัญญาอนุญาต | ต้องอ้างอิงอย่างไร |\n|---|---|---|---|\n| | | | |\n| | | | |\n\n**คำถามท้ายใบงาน**\n1. เพราะเหตุใดจึงไม่ควรเผยแพร่ผลงานก่อนยื่นคำขอรับอนุสิทธิบัตร\n2. โปรแกรมที่นักศึกษาเขียนเองได้รับความคุ้มครองแบบใด และนานเท่าใด","code":[],"images":[],"url":""}]},{"id":"fs3","type":"gallery","title":"รูปเพิ่มเติม","note":"","items":[{"id":"lg1","title":"บรรยากาศการเรียนในห้องเรียน","desc":"","url":"img/class-2.jpg"}]}],"refs":[{"title":"คำอธิบายรายวิชา กฎหมายในงานอาชีพอุตสาหกรรมพลังงาน ไฟฟ้า และอิเล็กทรอนิกส์ (หลักสูตร ปวส.)","url":"https://www.sice.ac.th/cur/put_course_cur_owner.php?teacher_id=216&id_subject=2903&term=2&yearly=2567"},{"title":"เตชทัต บูรณะอัศวกุล (2565). ความปลอดภัยที่เกี่ยวกับระบบไฟฟ้าในอาคาร สำหรับ จป. วิชาชีพ อย่างมืออาชีพ. สถาบันส่งเสริมความปลอดภัยฯ (สสปท.)","url":"https://www.tosh.or.th/index.php/blog/item/1051-2022-03-02-02-48-00"},{"title":"วริยา เคนทวาย (2564). ปัจจัยการรับรู้เรื่องความปลอดภัยและพฤติกรรมความปลอดภัยในการปฏิบัติงานของพนักงานระดับปฏิบัติการ การไฟฟ้าส่วนภูมิภาค จังหวัดปทุมธานี. วารสารวิทยาศาสตร์สุขภาพ มหาวิทยาลัยปทุมธานี","url":"https://ph01.tci-thaijo.org/index.php/PTUJST/article/view/243424"},{"title":"ภิญโญ สุโรจนานนท์ และคณะ. ความปลอดภัยในการทำงานของผู้ปฏิบัติงานก่อสร้างระบบจำหน่าย กรณีศึกษา กฟภ.อำเภอโคกสำโรง. วารสารวิทยาศาสตร์และเทคโนโลยีนอร์ทเทิร์น","url":"https://he03.tci-thaijo.org/index.php/scintc/article/view/1155"},{"title":"สรุปข้อกำหนดกฎกระทรวงฯ เกี่ยวกับไฟฟ้า พ.ศ. 2558 (ข้อ 6–22) – Safety Station 101","url":"https://101.safety.ac.th/%E0%B8%AB%E0%B8%A1%E0%B8%A7%E0%B8%94/%E0%B9%84%E0%B8%9F%E0%B8%9F%E0%B9%89%E0%B8%B2/%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%AA%E0%B8%B2%E0%B8%A2/electrical-work-area-legal/"},{"title":"เดลินิวส์: ช่างไฟฟ้าภายในอาคารต้องมีหนังสือรับรองความรู้ความสามารถ ตาม พ.ร.บ.ส่งเสริมการพัฒนาฝีมือแรงงาน","url":"https://www.dailynews.co.th/news/4861523/"},{"title":"กรมพัฒนาฝีมือแรงงาน (2568). ชวนช่างไฟฟ้าปฏิบัติตามกฎหมาย (บทลงโทษลูกจ้างและนายจ้าง)","url":"https://www.thaipr.net/?p=3603205"},{"title":"นิศาชล ศศานนท์, กรมทรัพย์สินทางปัญญา. ความรู้เบื้องต้นเกี่ยวกับสิทธิบัตรและการสืบค้นสิทธิบัตร","url":"https://ip.kku.ac.th/wp-content/uploads/2022/12/%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A3%E0%B8%B9%E0%B9%89%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%95%E0%B9%89%E0%B8%99IP.pdf"},{"title":"กรมทรัพย์สินทางปัญญา. การคุ้มครองแบบผังภูมิของวงจรรวม","url":"https://www.ipthailand.go.th/images/3534/2565/Acts/Description_Cycle.pdf"},{"title":"พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 ส่วนที่ 4 อายุแห่งการคุ้มครองลิขสิทธิ์ (มาตรา 19–26)","url":"https://www.drthawip.com/book/export/html/1984"},{"title":"ประชาชาติธุรกิจ (2562). สาระสำคัญ พ.ร.บ.โรงงาน ฉบับแก้ไข","url":"https://www.prachachat.net/economic/news-323159"},{"title":"Chitcham, Lengvittaya & Suparp (2568). Legal Measures to Control Industrial Factory Operations. Legal State Journal, 3(4)","url":"https://so19.tci-thaijo.org/index.php/LSJ/article/view/2197"},{"title":"กรมควบคุมมลพิษ. E-Waste Management in Thailand (2568)","url":"https://www.iges.or.jp/sites/default/files/2025-02/03_E-Waste%20Management%20in%20Thailand_Ms.%20Sirinart%20Pongyart_PCD.pdf"}]},{"id":"cPLC","code":"PLC","name":"ชุมชนการเรียนรู้ทางวิชาชีพ (PLC)","t":null,"p":null,"n":null,"h":2,"slots":[{"d":3,"s":"16:00","e":"18:00","room":"","group":""}],"sections":[{"id":"gs1","type":"lessons","title":"เนื้อหา","note":"","items":[{"id":"cl1","title":"ชุมชนการเรียนรู้ทางวิชาชีพ (PLC) คืออะไร","desc":"ความหมาย เป้าหมาย และองค์ประกอบสำคัญของ PLC ตามแนวคิดของนักวิชาการ","body":"### ความหมาย\nชุมชนการเรียนรู้ทางวิชาชีพ (Professional Learning Community: PLC) คือการรวมกลุ่มของครูและบุคลากรทางการศึกษาเพื่อเรียนรู้และพัฒนาวิชาชีพร่วมกันอย่างต่อเนื่อง โดยมีเป้าหมายสุดท้ายที่ **คุณภาพการเรียนรู้ของผู้เรียน** ไม่ใช่การประชุมเพื่อรายงานผลเท่านั้น\n\n### 5 มิติของ PLC ตามแนวคิดของ Shirley Hord\n1. **ภาวะผู้นำร่วมและสนับสนุน** ผู้บริหารและครูร่วมกันตัดสินใจ ผู้บริหารจัดโครงสร้างให้เกิดการร่วมมือ\n2. **ค่านิยมและวิสัยทัศน์ร่วม** ทุกคนมุ่งไปที่การเรียนรู้ของผู้เรียนเป็นหลัก\n3. **การเรียนรู้ร่วมกันและนำไปใช้** ร่วมกันแสวงหาความรู้ใหม่แล้วนำไปปรับการสอนและการวัดผล\n4. **สภาพที่เอื้ออำนวย** มีเวลา ช่องทางสื่อสาร และความไว้วางใจระหว่างเพื่อนครู\n5. **การแบ่งปันการปฏิบัติ** เปิดชั้นเรียนให้เพื่อนครูสังเกต ให้ข้อมูลป้อนกลับอย่างเป็นกัลยาณมิตร\n\n### องค์ประกอบในบริบทไทย\nPannathat Champakul (2565) สรุปองค์ประกอบของ PLC ไว้ 6 ด้าน ได้แก่ คุณค่าและวิสัยทัศน์ร่วม การร่วมมือรวมพลัง การเรียนรู้และพัฒนาวิชาชีพ ความรับผิดชอบร่วมต่อการเรียนรู้ของผู้เรียน การสนทนาแบบสะท้อนผล และภาวะผู้นำร่วม และเสนอว่าครูยุคดิจิทัลควรนำเทคโนโลยีดิจิทัลมาใช้ให้เหมาะกับเนื้อหาและผู้เรียน","code":[],"images":[],"url":""},{"id":"cl2","title":"กระบวนการ PLC แบบ Plan–Do–See","desc":"ขั้นตอนการทำงานของกลุ่ม PLC ตั้งแต่ระบุปัญหาจนถึงการสะท้อนผลและขยายผล","body":"### วงจรการทำงาน\n1. **ระบุปัญหา** เลือกปัญหาการเรียนรู้จากหลักฐานจริง เช่น ผลการทำใบงาน คะแนนสอบ หรือพฤติกรรมในชั้นเรียน\n2. **ร่วมออกแบบ (Plan)** ครูในกลุ่มร่วมกันออกแบบแผนการสอน สื่อ และเครื่องมือวัดผล\n3. **สอนและสังเกต (Do)** ครูผู้สอนนำแผนไปใช้ เพื่อนครูเข้าสังเกตโดยเน้นที่การเรียนรู้ของผู้เรียน\n4. **สะท้อนผล (See)** พูดคุยจากสิ่งที่สังเกตเห็นจริง ไม่ตัดสินตัวครู แล้วสรุปสิ่งที่ได้เรียนรู้\n5. **ปรับปรุงและขยายผล** ปรับแผนแล้วทดลองซ้ำ บันทึกทุกครั้งใน Logbook\n\n### บทบาทในกลุ่ม\n| บทบาท | หน้าที่ |\n|---|---|\n| ผู้อำนวยความสะดวก (Facilitator) | ดำเนินการประชุม ควบคุมเวลา ให้ทุกคนได้พูด |\n| ครูผู้สอน (Model Teacher) | นำแผนการสอนที่ออกแบบร่วมกันไปใช้จริง |\n| ผู้สังเกต (Buddy) | สังเกตการเรียนรู้ของผู้เรียนและเก็บหลักฐาน |\n| ผู้บันทึก (Recorder) | บันทึกการประชุมลง Logbook |\n| ผู้เชี่ยวชาญ (Expert) | ให้ความรู้หรือข้อเสนอแนะทางวิชาการ |\n\n> งานวิจัยของ สิราวรรณ จรัสรวีวัฒน์ (2563) พบว่าหลักสูตรฝึกอบรมกระบวนการ PLC สำหรับนิสิตฝึกสอนได้รับการประเมินความเหมาะสมระดับมาก และผู้เข้าอบรมมีเจตคติต่อประโยชน์ของกระบวนการในระดับดีมาก (ค่าเฉลี่ย 4.82)","code":[],"images":[{"url":"svg/plc-cycle.svg","cap":"ภาพที่ 1 วงจรการทำงานของ PLC (วาดใหม่)"}],"url":""},{"id":"cl3","title":"PLC ของครูผู้ช่วย แผนกวิชาช่างอิเล็กทรอนิกส์","desc":"การมีส่วนร่วมในชุมชนการเรียนรู้ทางวิชาชีพ และหลักการทำงานเป็นทีม","body":"### เวลาดำเนินกิจกรรม\nกลุ่ม PLC จัดกิจกรรมทุกวันพุธ เวลา 16:00–18:00 น. ตามตารางสอนภาคเรียนที่ 2/2569\n\n### การมีส่วนร่วม\nเข้าร่วมกิจกรรมที่เกี่ยวข้องกับการศึกษา และแลกเปลี่ยนเรียนรู้กิจกรรมต่าง ๆ ร่วมกับเพื่อนครูและชุมชน นำปัญหาที่พบในรายวิชาที่สอน เช่น ทักษะการเขียนโปรแกรมควบคุมของผู้เรียน มาออกแบบแนวทางแก้ไขร่วมกัน\n\n### หลักการทำงานเป็นทีม\n1. มีวัตถุประสงค์ที่ชัดเจน\n2. จัดลำดับความสำคัญของงาน\n3. ติดตามผลการทำงาน\n4. พัฒนาความรู้และทำงานเป็นทีมอย่างต่อเนื่อง เพื่อให้เกิดประสิทธิภาพสูงสุด\n\n### ตัวอย่างประเด็นที่นำเข้ากลุ่ม PLC\n- นักเรียนต่อวงจรถูกต้องแต่เขียนโปรแกรมควบคุมไม่ได้ ควรปรับลำดับการสอนอย่างไร\n- ใช้ใบงานแบบมีตารางบันทึกผลช่วยให้นักเรียนสรุปความรู้ได้ดีขึ้นหรือไม่\n- การใช้สื่อจำลองวงจร (Proteus) ก่อนต่อวงจรจริงช่วยลดความเสียหายของอุปกรณ์ได้หรือไม่","code":[],"images":[],"url":""}]},{"id":"gs2","type":"worksheets","title":"แบบบันทึก","note":"","items":[{"id":"cw1","title":"แบบบันทึกกิจกรรม PLC (Logbook)","desc":"ใช้บันทึกการประชุมกลุ่มทุกครั้ง","body":"**ข้อมูลการประชุม**\n- ครั้งที่ ........ วันที่ ........ เวลา ........ สถานที่ ........\n- สมาชิกที่เข้าร่วม และบทบาท (Facilitator / Model Teacher / Buddy / Recorder / Expert)\n\n**ประเด็นปัญหาที่นำเข้าสู่กลุ่ม**\n- ปัญหาการเรียนรู้ที่พบ และหลักฐานที่ใช้ยืนยัน\n\n**สาระสำคัญจากการแลกเปลี่ยน**\n1. สาเหตุของปัญหาที่กลุ่มวิเคราะห์ได้\n2. แนวทางแก้ไขที่กลุ่มเสนอ\n3. สิ่งที่จะทดลองในชั้นเรียนก่อนการประชุมครั้งต่อไป\n\n**ลงชื่อ**\n| บทบาท | ชื่อ-สกุล | ลายมือชื่อ |\n|---|---|---|\n| ผู้บันทึก | | |\n| ผู้อำนวยความสะดวก | | |","code":[],"images":[],"url":""},{"id":"cw2","title":"แบบสังเกตชั้นเรียน (สำหรับ Buddy)","desc":"เน้นสังเกตการเรียนรู้ของผู้เรียน ไม่ประเมินตัวครู","body":"**ข้อมูลชั้นเรียน**\n- รายวิชา ........ กลุ่มเรียน ........ หัวข้อ ........ ครูผู้สอน ........\n\n**สิ่งที่สังเกต**\n| ช่วงเวลา | กิจกรรมของครู | พฤติกรรมของผู้เรียน | หลักฐานการเรียนรู้ |\n|---|---|---|---|\n| นำเข้าสู่บทเรียน | | | |\n| ฝึกปฏิบัติ | | | |\n| สรุป | | | |\n\n**คำถามสำหรับการสะท้อนผล**\n1. ผู้เรียนคนใด/กลุ่มใดเรียนรู้ได้ดี เห็นได้จากอะไร\n2. จุดใดที่ผู้เรียนติดขัด เพราะอะไร\n3. ถ้าสอนครั้งต่อไป ควรปรับอะไร","code":[],"images":[],"url":""},{"id":"cw3","title":"แบบสรุปผลและสะท้อนคิดรายภาคเรียน","desc":"สรุปผลการดำเนินงาน PLC เมื่อสิ้นภาคเรียน","body":"**สรุปผล**\n- ประเด็นที่ดำเนินการ ........\n- จำนวนครั้งที่ประชุม ........ ครั้ง รวม ........ ชั่วโมง\n\n**ผลที่เกิดกับผู้เรียน**\n- เปรียบเทียบผลการเรียนหรือผลงานก่อนและหลังการปรับการสอน\n\n**สิ่งที่ครูได้เรียนรู้**\n1. ด้านการออกแบบการสอน\n2. ด้านการวัดและประเมินผล\n3. ด้านการทำงานร่วมกับเพื่อนครู\n\n**แนวทางในภาคเรียนถัดไป**\n- ........","code":[],"images":[],"url":""}]},{"id":"gs3","type":"gallery","title":"รูปเพิ่มเติม","note":"","items":[{"id":"cg1","title":"การมีส่วนร่วมในชุมชนการเรียนรู้ทางวิชาชีพ","desc":"","url":"img/plc-meeting.jpg"},{"id":"cg2","title":"การพัฒนาทีมงานและแลกเปลี่ยนเรียนรู้ร่วมกับเพื่อนครู","desc":"","url":"img/team-2.jpg"}]}],"refs":[{"title":"Pannathat Champakul (2565). ชุมชนการเรียนรู้ทางวิชาชีพ: วิถีแห่งการพัฒนาครูยุคดิจิทัล. Journal of Local Management and Development, Pibulsongkram Rajabhat University, 2(2), 57–73","url":"https://so06.tci-thaijo.org/index.php/jclmd_psru/article/view/259255"},{"title":"สิราวรรณ จรัสรวีวัฒน์ (2563). ผลการใช้หลักสูตรฝึกอบรม เรื่อง กระบวนการชุมชนการเรียนรู้วิชาชีพ (PLC) สำหรับนิสิตฝึกปฏิบัติการสอน. วารสารศึกษาศาสตร์ ม.บูรพา","url":"https://so02.tci-thaijo.org/index.php/edubuu/article/view/244178"},{"title":"SEDL. Professional Learning Communities: A Review of the Five Dimensions (Hord)","url":"https://sedl.org/pubs/change45/2.html"}]}]}</script>

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function uid(p){return (p||'i')+Math.random().toString(36).slice(2,9)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return String(n).padStart(2,'0')}
function safeUrl(u){
  u=String(u||'').trim(); if(!u) return '';
  if(/^https?:\/\/[^\s"'<>]+$/i.test(u)) return u;
  if(/^\/_blob\/[A-Za-z0-9]+$/.test(u)) return u;
  if(/^(img|svg|files)\/[A-Za-z0-9._\-\/]+$/.test(u)&&u.indexOf('..')<0) return u;
  if(/^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,[A-Za-z0-9+\/=]+$/.test(u)) return u;
  if(/^(www\.|drive\.google\.|docs\.google\.)[^\s"'<>]+$/i.test(u)) return 'https://'+u;
  return '';
}
function toMin(t){var m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):null}
function ext(n){var m=/\.([A-Za-z0-9]{1,5})$/.exec(n||'');return m?m[1].toLowerCase():''}
function linkKind(it){
  var u=safeUrl(it.url); if(!u) return '';
  if(u.indexOf('/_blob/')===0) return it.fileName?(ext(it.fileName).toUpperCase()||'ไฟล์'):'ไฟล์แนบ';
  try{var h=new URL(u).hostname.replace(/^www\./,'');
    if(/(^|\.)drive\.google\.com$|(^|\.)docs\.google\.com$/.test(h)) return 'Google Drive';
    if(/youtu\.?be/.test(h)) return 'YouTube';
    if(/canva\.com$/.test(h)) return 'Canva';
    if(/forms\.gle$/.test(h)) return 'Google Forms';
    return h;
  }catch(e){return 'เปิดลิงก์'}
}
function exChip(it){return it&&it.ex?'<span class="ex">ตัวอย่าง</span>':''}
function itemAction(it,label){
  var u=safeUrl(it.url);
  if(!u) return '<span class="nofile">ยังไม่แนบไฟล์</span>';
  return '<a class="open" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer"><span>'+esc(label||linkKind(it))+'</span>'+ARROW+'</a>';
}
function routeExists(r){return r==='home'||data.pages.some(function(p){return p.id===r})||data.subjects.some(function(s){return s.id===r})}
function owner(scope){return data.pages.filter(function(p){return p.id===scope})[0]||data.subjects.filter(function(s){return s.id===scope})[0]||null}
function isSubject(o){return data.subjects.indexOf(o)>=0}
function totals(){
  var t=0,p=0,n=0,h=0,g={};
  data.subjects.forEach(function(s){t+=+s.t||0;p+=+s.p||0;n+=+s.n||0;h+=+s.h||0;(s.slots||[]).forEach(function(x){if(x.group)g[x.group]=1})});
  return {t:t,p:p,n:n,h:h,groups:Object.keys(g).length};
}
function counts(list){
  var c={lessons:0,ws:0,code:0,photo:0};
  (list||data.subjects).forEach(function(s){(s.sections||[]).forEach(function(sec){
    var it=sec.items||[];
    if(sec.type==='lessons'){c.lessons+=it.length;it.forEach(function(i){c.code+=(i.code||[]).length;c.photo+=(i.images||[]).length})}
    else if(sec.type==='worksheets'){c.ws+=it.length;it.forEach(function(i){c.code+=(i.code||[]).length;c.photo+=(i.images||[]).length})}
    else if(sec.type==='gallery'){c.photo+=it.length}
  })});
  return c;
}
function groupsOf(s){var g=[];(s.slots||[]).forEach(function(x){if(x.group&&g.indexOf(x.group)<0)g.push(x.group)});return g}
function tpnText(s){return s.t==null&&s.p==null&&s.n==null?'':[s.t||0,s.p||0,s.n||0].join('-')}
function year(){var m=/(\d{4})/.exec(data.site.term||'');return m?m[1]:''}

/* ---------- light markdown ---------- */
function inl(s){
  var parts=String(s).split('`'),out='';
  for(var i=0;i<parts.length;i++){
    if(i%2){out+='<code>'+esc(parts[i])+'</code>';continue}
    var t=esc(parts[i]);
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,function(m,a,u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+a+'</a>'});
    out+=t;
  }
  return out;
}
function cells(line){
  var c=[],cur='',inC=false;line=line.trim().replace(/^\|/,'').replace(/\|$/,'');
  for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='`')inC=!inC;if(ch==='|'&&!inC){c.push(cur);cur=''}else cur+=ch}
  c.push(cur);return c.map(function(x){return x.trim()});
}
function md(src){
  var L=String(src||'').replace(/\r/g,'').split('\n'),out='',i=0;
  var isBlock=function(l){l=l.trim();return /^###\s/.test(l)||/^>/.test(l)||/^\|/.test(l)||/^-\s/.test(l)||/^\d+\.\s/.test(l)};
  while(i<L.length){
    var l=L[i];
    if(!l.trim()){i++;continue}
    if(/^###\s/.test(l)){out+='<h4>'+inl(l.replace(/^###\s*/,''))+'</h4>';i++;continue}
    if(/^>/.test(l)){var q=[];while(i<L.length&&/^>/.test(L[i])){q.push(L[i].replace(/^>\s?/,''));i++}out+='<div class="note">'+inl(q.join(' '))+'</div>';continue}
    if(/^\|/.test(l.trim())){
      var rows=[];while(i<L.length&&/^\|/.test(L[i].trim())){rows.push(L[i]);i++}
      rows=rows.filter(function(r){return !/^:?-{2,}/.test(r.trim().replace(/^\|\s*/,''))});
      if(!rows.length)continue;
      var head=cells(rows[0]);
      out+='<div class="tbl"><table><thead><tr>'+head.map(function(c){return '<th>'+inl(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
        rows.slice(1).map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+inl(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
      continue;
    }
    if(/^-\s/.test(l)){var li=[];while(i<L.length&&/^-\s/.test(L[i])){li.push(L[i].replace(/^-\s/,''));i++}out+='<ul>'+li.map(function(x){return '<li>'+inl(x)+'</li>'}).join('')+'</ul>';continue}
    if(/^\d+\.\s/.test(l)){var ol=[];while(i<L.length&&/^\d+\.\s/.test(L[i])){ol.push(L[i].replace(/^\d+\.\s/,''));i++}out+='<ol>'+ol.map(function(x){return '<li>'+inl(x)+'</li>'}).join('')+'</ol>';continue}
    var p=[];while(i<L.length&&L[i].trim()&&(!p.length||!isBlock(L[i]))){p.push(L[i]);i++}
    out+='<p>'+inl(p.join(' '))+'</p>';
  }
  return out;
}
function plain(s){return String(s||'').replace(/\|?\s*:?-{2,}[-|: ]*/g,' ').replace(/[`*#>|]/g,' ').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ').trim()}

/* ---------- syntax highlight ---------- */
var KW={
  c:'auto break case char const continue default do double else enum extern float for goto if int long return short signed sizeof static struct switch typedef union unsigned void volatile while bool true false String byte boolean HIGH LOW INPUT OUTPUT INPUT_PULLUP include define setup loop',
  python:'and as assert break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield print',
  sh:'pip python cd mkdir set echo deactivate rem REM'
};
function hl(src,lang){
  var kind=(lang==='python')?'python':(lang==='bat'||lang==='bash')?'sh':(lang==='text')?'':'c';
  if(!kind) return esc(src);
  var kw={};KW[kind].split(' ').forEach(function(w){kw[w]=1});
  var re=kind==='python'?/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|f?"(?:\\.|[^"\\\n])*"|f?'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g
        :kind==='sh'?/((?:^|\s)(?:#|::)[^\n]*)|("[^"\n]*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w.-]*)/g
        :/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b(?:0[xX][0-9A-Fa-f]+|\d+(?:\.\d+)?)[uUlLfF]*\b)|(#\s*[A-Za-z]+|[A-Za-z_]\w*)/g;
  var out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    var t=m[0],cls=m[1]?'tc':m[2]?'ts':m[3]?'tn':(t.charAt(0)==='#'?'tp':(kw[t]?'tk':''));
    out+=cls?'<span class="'+cls+'">'+esc(t)+'</span>':esc(t);
    last=re.lastIndex;
    if(m[0].length===0) re.lastIndex++;
  }
  return out+esc(src.slice(last));
}
